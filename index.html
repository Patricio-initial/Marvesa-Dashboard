<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Tanques</title>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --line:rgba(255,255,255,.08);
  --ok:#22c55e;
  --mid:#f59e0b;
  --high:#ef4444;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

h1{
  margin-bottom:5px;
}

.section-title{
  margin-top:40px;
  margin-bottom:15px;
  font-size:14px;
  color:var(--muted);
  letter-spacing:.5px;
  text-transform:uppercase;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.card{
  background:var(--card);
  padding:16px;
  border-radius:12px;
  border:1px solid var(--line);
}

.small-card{
  padding:12px;
  font-size:13px;
}

.bar{
  height:10px;
  background:rgba(255,255,255,.1);
  border-radius:999px;
  margin-top:8px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  width:0%;
  transition:.4s ease;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:13px;
}

th{
  color:var(--muted);
}

.footer{
  margin-top:30px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="container">

<h1>Dashboard Tanques</h1>
<div id="lastUpdate" style="font-size:12px;color:var(--muted);"></div>

<div class="section-title">Resumen por Proveedor</div>
<div id="supplierGrid" class="grid"></div>

<div class="section-title">Detalle Tanque por Tanque</div>
<div id="tankGrid" class="grid"></div>

<div class="section-title">Tabla Resumen</div>
<table>
<thead>
<tr>
<th>Tanque</th>
<th>Proveedor</th>
<th>Stock (kg)</th>
<th>Capacidad (kg)</th>
<th>%</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<div class="footer">
Auto-refresh cada 5 minutos. Refrescando la página también actualiza.
</div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdyOrnlQBDihM-vR3ylD5hyWkwahrugTXpi_tEeEwRxXZiNIEGlZ2VMZvwJ3gkzxHF2XNcFXMQApun/pub?gid=1509369466&single=true&output=csv";

function parseCSV(text){
  return text.trim().split("\n").map(r=>r.split(","));
}

function parseNumber(v){
  if(!v) return 0;
  return parseFloat(v.replace(/,/g,"")) || 0;
}

function getColor(p){
  if(p>=85) return "var(--high)";
  if(p>=65) return "var(--mid)";
  return "var(--ok)";
}

async function loadData(){
  const res = await fetch(CSV_URL + "&_=" + Date.now());
  const text = await res.text();
  const rows = parseCSV(text);

  const data = rows.slice(1).map(r=>({
    tank:r[0],
    supplier:r[1],
    stock:parseNumber(r[2]),
    capacity:parseNumber(r[3]),
    pct:parseFloat(r[4]) || 0
  }));

  renderSuppliers(data);
  renderTanks(data);
  renderTable(data);

  document.getElementById("lastUpdate").innerText =
    "Última actualización: " + new Date().toLocaleString("es-AR");
}

function renderSuppliers(data){
  const grid = document.getElementById("supplierGrid");
  grid.innerHTML="";

  const grouped={};

  data.forEach(d=>{
    if(!grouped[d.supplier]){
      grouped[d.supplier]={stock:0,capacity:0};
    }
    grouped[d.supplier].stock += d.stock;
    grouped[d.supplier].capacity += d.capacity;
  });

  Object.entries(grouped).forEach(([supplier,val])=>{
    const pct = val.capacity ? (val.stock/val.capacity)*100 : 0;

    const card = document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <strong>${supplier}</strong><br>
      ${val.stock.toLocaleString()} kg / ${val.capacity.toLocaleString()} kg
      <div class="bar">
        <div class="bar-fill" style="width:${pct}%; background:${getColor(pct)};"></div>
      </div>
      <div style="margin-top:6px;font-weight:600;color:${getColor(pct)};">
        ${pct.toFixed(1)}%
      </div>
    `;

    grid.appendChild(card);
  });
}

function renderTanks(data){
  const grid = document.getElementById("tankGrid");
  grid.innerHTML="";

  data.forEach(d=>{
    const card = document.createElement("div");
    card.className="card small-card";

    card.innerHTML=`
      <strong>TK ${d.tank}</strong><br>
      <span style="color:var(--muted)">${d.supplier}</span><br>
      ${d.stock.toLocaleString()} kg
      <div class="bar">
        <div class="bar-fill" style="width:${d.pct}%; background:${getColor(d.pct)};"></div>
      </div>
    `;

    grid.appendChild(card);
  });
}

function renderTable(data){
  const body = document.getElementById("tableBody");
  body.innerHTML="";

  data.forEach(d=>{
    body.innerHTML+=`
      <tr>
        <td>${d.tank}</td>
        <td>${d.supplier}</td>
        <td>${d.stock.toLocaleString()}</td>
        <td>${d.capacity.toLocaleString()}</td>
        <td style="color:${getColor(d.pct)};font-weight:600;">
          ${d.pct.toFixed(1)}%
        </td>
      </tr>
    `;
  });
}

loadData();
setInterval(loadData, 300000);
</script>

</body>
</html>
