<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tank Storage Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    /* ─── Design tokens ─────────────────────────────────────── */
    :root {
      --bg:        #f0f2f5;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --primary:   #1e3a5f;
      --primary-light: #2a4f82;
      --text:      #1a202c;
      --muted:     #64748b;
      --green:     #16a34a;
      --green-bg:  #f0fdf4;
      --yellow:    #b45309;
      --yellow-bg: #fffbeb;
      --red:       #dc2626;
      --red-bg:    #fef2f2;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    }

    /* ─── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }
    code { font-family: 'Menlo', 'Consolas', monospace; font-size: 0.875em;
           background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 4px; }

    /* ─── Header ─────────────────────────────────────────────── */
    .header {
      background: var(--primary); color: white;
      padding: 0.875rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    .header-icon { font-size: 1.5rem; }
    .header-title { font-size: 1.125rem; font-weight: 700; letter-spacing: -.01em; }
    .header-right { display: flex; align-items: center; gap: 1rem; font-size: 0.8125rem; opacity: .85; }
    .header-meta { display: flex; flex-direction: column; align-items: flex-end; gap: .1rem; }
    #last-updated { font-size: .75rem; opacity: .8; }
    #next-refresh  { font-size: .75rem; opacity: .7; }
    .refresh-btn {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: white; padding: .375rem .875rem; border-radius: 6px; cursor: pointer;
      font-size: .8125rem; transition: background .15s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,.25); }
    .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ─── Layout ─────────────────────────────────────────────── */
    .main { padding: 1.5rem 2rem; max-width: 1500px; margin: 0 auto; }

    /* ─── Summary cards ──────────────────────────────────────── */
    .summary-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .summary-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 1.125rem 1.5rem; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: .25rem;
      border-left: 4px solid var(--border);
    }
    .summary-card .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .summary-card .value { font-size: 2rem; font-weight: 800; line-height: 1; color: var(--text); }
    .summary-card.s-optimal { border-left-color: var(--green); }
    .summary-card.s-optimal .value { color: var(--green); }
    .summary-card.s-warning { border-left-color: var(--yellow); }
    .summary-card.s-warning .value { color: var(--yellow); }
    .summary-card.s-loading { border-left-color: #3b82f6; }
    .summary-card.s-loading .value { color: #3b82f6; }

    /* ─── Toolbar ────────────────────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap;
    }
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; }
    .tab {
      padding: .4375rem 1rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; font-size: .875rem; color: var(--muted); transition: all .15s;
    }
    .tab:hover  { border-color: var(--primary-light); color: var(--primary); }
    .tab.active { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: .625rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #search-input {
      padding: .4375rem .75rem .4375rem 2rem; border-radius: 6px;
      border: 1px solid var(--border); font-size: .875rem; width: 220px;
      background: var(--surface); color: var(--text);
    }
    #search-input:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(42,79,130,.15); }

    /* ─── Sort controls ──────────────────────────────────────── */
    .sort-row {
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: 1rem; font-size: .8125rem; color: var(--muted);
    }
    .sort-btn {
      padding: .25rem .625rem; border-radius: 5px; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer; font-size: .8125rem; color: var(--muted); transition: all .15s;
    }
    .sort-btn:hover  { border-color: var(--primary-light); color: var(--primary); }
    .sort-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* ─── Tank grid / card ───────────────────────────────────── */
    .tank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: .75rem; }
    .tank-card {
      background: var(--surface); border-radius: var(--radius);
      padding: .75rem .875rem .7rem;
      box-shadow: var(--shadow); border-top: 3px solid var(--green);
      position: relative; transition: transform .15s, box-shadow .15s;
    }
    .tank-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .tank-card.warning { border-top-color: var(--yellow); background: var(--yellow-bg); }
    .tank-card.optimal { border-top-color: #15803d; background: var(--green-bg); }
    .tank-name { font-weight: 700; font-size: .875rem; margin-bottom: .2rem; color: var(--text); }
    .product-badge {
      display: inline-block; padding: .1rem .45rem; border-radius: 999px;
      background: #e8edf5; color: var(--primary); font-size: .7rem; font-weight: 600;
      margin-bottom: .6rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tank-card.warning .product-badge { background: #fde68a; color: #78350f; }
    .tank-card.optimal .product-badge { background: #bbf7d0; color: #14532d; }
    .fill-bar-bg { background: #e2e8f0; border-radius: 999px; height: 6px; margin-bottom: .375rem; overflow: hidden; }
    .fill-bar { height: 100%; border-radius: 999px; background: var(--green); transition: width .4s ease; }
    .tank-card.warning .fill-bar { background: #d97706; }
    .tank-card.optimal .fill-bar { background: #15803d; }
    .fill-pct  { font-weight: 800; font-size: 1rem; }
    .fill-vols { font-size: .7rem; color: var(--muted); margin-top: .1rem; opacity: .8; }
    .status-chip {
      position: absolute; top: .75rem; right: .75rem;
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; padding: .1rem .4rem; border-radius: 4px;
    }
    .tank-card.warning .status-chip { background: #fde68a; color: #78350f; }
    .tank-card.optimal .status-chip { background: #bbf7d0; color: #14532d; }

    /* ─── Clickable tank link ─────────────────────────────────── */
    .tank-link {
      color: inherit; text-decoration: none; font-weight: 700;
      border-bottom: 1px dashed var(--primary-light);
      transition: color .12s;
    }
    .tank-link:hover { color: var(--primary-light); }
    html.dark .tank-link { border-bottom-color: #7eb8f7; }
    html.dark .tank-link:hover { color: #7eb8f7; }
    /* Small icon hint that it's a history link */
    .tank-link::after { content: ' ↗'; font-size: .6em; opacity: .6; }

    /* ─── Setup / Error / Loading ────────────────────────────── */
    .setup-panel {
      background: var(--surface); border-radius: var(--radius); padding: 2.5rem 2rem;
      text-align: center; max-width: 620px; margin: 2rem auto; box-shadow: var(--shadow);
    }
    .setup-panel h2 { font-size: 1.125rem; margin-bottom: .625rem; color: var(--primary); }
    .setup-panel p  { color: var(--muted); font-size: .9rem; line-height: 1.65; margin-bottom: 1.125rem; }
    .setup-panel ol { text-align: left; font-size: .875rem; line-height: 2.1; color: var(--muted); padding-left: 1.25rem; }
    .setup-panel ol li strong { color: var(--text); }
    .error-msg {
      background: var(--red-bg); border: 1px solid #fca5a5; border-radius: var(--radius);
      padding: 1rem 1.5rem; color: var(--red); margin-bottom: 1rem; font-size: .875rem;
    }
    .loading-msg { text-align: center; padding: 3rem; color: var(--muted); font-size: .9rem; }
    .no-results { grid-column: 1/-1; text-align: center; padding: 2.5rem; color: var(--muted); font-size: .9rem; }

    /* ─── Shared tank card ────────────────────────────────────── */
    .shared-card { grid-column: span 2; }
    @media (max-width: 500px) { .shared-card { grid-column: span 1; } }
    .shared-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .5rem; }
    .vessel-badge { font-size: .75rem; color: var(--muted); background: #f1f5f9; padding: .2rem .6rem; border-radius: 5px; font-weight: 500; white-space: nowrap; }
    .heat-badge { font-size: .85rem; margin-left: .25rem; vertical-align: middle; }

    .shared-fill-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: .2rem; margin-bottom: .875rem; }
    .shipper-table { width: 100%; border-collapse: collapse; font-size: .8125rem; margin-top: .25rem; }
    .shipper-table th { text-align: left; padding: .3rem .5rem; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--border); }
    .shipper-table td { padding: .4rem .5rem; border-bottom: 1px solid rgba(0,0,0,.05); color: var(--text); }
    .shipper-table tr:last-child td { border-bottom: none; }
    .shipper-table td:nth-child(2), .shipper-table td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
    .tank-card.warning .shipper-table th { border-bottom-color: #fde68a; }
    .tank-card.optimal .shipper-table th { border-bottom-color: #bbf7d0; }
    .ship-row-under td { background: #fef9c3; }
    .ship-row-ok    td { background: #d1fae5; }
    .ship-row-over  td { background: #fee2e2; }

    /* ─── Dark mode ──────────────────────────────────────────── */
    html.dark {
      --bg:        #0d1117; --surface:   #161b24; --border:    #252d3d;
      --text:      #e2e8f0; --muted:     #8892a4; --green-bg:  #052e16;
      --yellow-bg: #1c1200; --red-bg:    #1c0505;
      --shadow:    0 1px 4px rgba(0,0,0,.5);
    }
    html.dark .product-badge    { background: #1e2d45; color: #7eb8f7; }
    html.dark .vessel-badge     { background: #1e2535; }
    html.dark #search-input     { background: var(--surface); color: var(--text); border-color: var(--border); }
    html.dark .row-status-chip.warning { background: #78350f; color: #fde68a; }
    html.dark .row-status-chip.optimal { background: #14532d; color: #bbf7d0; }
    html.dark .shipper-table td { border-bottom-color: rgba(255,255,255,.05); }
    html.dark .ship-row-under td { background: rgba(251,191,36,.12); }
    html.dark .ship-row-ok    td { background: rgba(34,197,94,.10); }
    html.dark .ship-row-over  td { background: rgba(239,68,68,.12); }
    .dark-toggle {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
      color: white; padding: .3rem .55rem; border-radius: 6px;
      cursor: pointer; font-size: 1rem; line-height: 1; transition: background .15s;
    }
    .dark-toggle:hover { background: rgba(255,255,255,.22); }

    /* ─── Table / list view ──────────────────────────────────── */
    .table-wrap { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .tank-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .tank-table th { text-align: left; padding: .625rem 1rem; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 2px solid var(--border); font-weight: 600; }
    .tank-table td { padding: .7rem 1rem; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    .tank-table tbody tr:last-child td { border-bottom: none; }
    .tank-table tbody tr:hover { background: rgba(128,128,128,.06); }
    .col-tank    { font-weight: 700; white-space: nowrap; }
    .col-product { color: var(--muted); font-size: .825rem; }
    .col-num     { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .col-pct     { width: 38%; min-width: 180px; }
    .row-status-chip { display: inline-block; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: .1rem .35rem; border-radius: 4px; margin-left: .4rem; vertical-align: middle; }
    .row-status-chip.warning  { background: #fde68a; color: #78350f; }
    .row-status-chip.critical { background: #fecaca; color: #7f1d1d; }
    .pct-cell  { display: flex; align-items: center; gap: .625rem; }
    .pct-track { flex: 1; height: 7px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .pct-fill  { height: 100%; border-radius: 999px; transition: width .4s ease; }
    .pct-fill.loading { background: var(--green); }
    .pct-fill.warning { background: #d97706; }
    .pct-fill.optimal { background: #15803d; }
    .pct-fill.unknown { background: var(--muted); }
    .pct-label { min-width: 3.75rem; text-align: right; font-weight: 700; font-size: .875rem; }
    .pct-label.loading { color: var(--green); }
    .pct-label.warning { color: #d97706; }
    .pct-label.optimal { color: #15803d; }
    .pct-label.unknown { color: var(--muted); }

    /* ─── Shared list view ───────────────────────────────────── */
    .shared-summary-row td { font-weight: 700; background: rgba(0,0,0,.025); border-top: 2px solid var(--border); }
    html.dark .shared-summary-row td { background: rgba(255,255,255,.04); }
    .shipper-indent { color: var(--muted); padding-left: 1.75rem !important; font-weight: 400; font-size: .8rem; }

    /* ─── TPR history chart (unchanged from index.html) ─────── */
    .chart-section { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem 1.5rem; margin-top: 1.25rem; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: .5rem; }
    .chart-title { font-size: .9rem; font-weight: 700; color: var(--text); }
    .chart-title span { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: .4rem; }
    .period-btns { display: flex; gap: .3rem; flex-wrap: wrap; }
    .period-btn { padding: .2rem .55rem; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: .75rem; cursor: pointer; transition: all .15s; }
    .period-btn:hover  { border-color: var(--primary-light); color: var(--primary); }
    .period-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
    .chart-canvas-wrap { position: relative; height: 300px; }
    .chart-loading { text-align: center; padding: 2rem; color: var(--muted); font-size: .875rem; }
    .chart-legend { display: flex; gap: 1.25rem; margin-top: .75rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: .35rem; font-size: .75rem; color: var(--muted); }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-line { width: 20px; height: 2px; flex-shrink: 0; }

    /* ─── Tank detail page ───────────────────────────────────── */
    .detail-nav {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .back-btn {
      display: flex; align-items: center; gap: .35rem;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: .4rem .875rem; border-radius: 6px;
      cursor: pointer; font-size: .875rem; transition: all .15s; font-weight: 500;
    }
    .back-btn:hover { border-color: var(--primary-light); color: var(--primary); }
    .detail-sep { color: var(--border); }
    .detail-title { font-size: 1.25rem; font-weight: 800; color: var(--text); }
    .detail-subtitle { font-size: .875rem; color: var(--muted); }

    /* Detail stat cards: 3-column */
    .detail-stats { grid-template-columns: repeat(3, 1fr) !important; max-width: 720px; }

    /* Activity table */
    .kgs-pos { color: var(--green); font-weight: 600; }
    .kgs-neg { color: var(--red);   font-weight: 600; }
    .activity-section { margin-top: 1.25rem; }

    /* ─── Carboclor sub-tabs (Tanks / Shippers) ─────────────── */
    .subtabs-row { margin-bottom: .875rem; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .subtab {
      padding: .35rem .875rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; font-size: .8125rem; color: var(--muted); transition: all .15s; font-weight: 500;
    }
    .subtab:hover  { border-color: var(--primary-light); color: var(--primary); }
    .subtab.active { background: var(--primary-light); border-color: var(--primary-light); color: white; font-weight: 600; }

    /* History hint badge on facility title */
    .history-hint {
      display: inline-block; font-size: .65rem; font-weight: 600;
      background: #e0e7ff; color: #3730a3;
      padding: .1rem .4rem; border-radius: 4px; margin-left: .5rem; vertical-align: middle;
    }
    html.dark .history-hint { background: #1e2d5c; color: #818cf8; }

    /* Stock value shown inline on mobile when col-num columns are hidden */
    .mobile-stock { display: none; font-size: .72rem; color: var(--muted); font-weight: 400; margin-left: .3rem; }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 900px)  { .main { padding: 1rem; } .summary-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 700px)  {
      .tank-table .col-num { display: none; }
      .col-pct { min-width: 120px; }
      .mobile-stock { display: inline; }
    }
    @media (max-width: 600px)  {
      .header { padding: .75rem 1rem; }
      .header-title { font-size: .875rem; }
      .header-meta { display: none; }
      .summary-grid { grid-template-columns: repeat(2,1fr); gap: .625rem; }
      .detail-stats { grid-template-columns: repeat(2,1fr) !important; }
      .toolbar { flex-direction: column; align-items: stretch; }
      #search-input { width: 100%; }
      .sort-row { flex-wrap: wrap; row-gap: .4rem; }
      .sort-btn  { white-space: nowrap; }
      .sort-row > span { margin-left: 0 !important; }
      .tank-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: .75rem; }
      .col-shared-meta { display: none; }
      .col-pct { min-width: 90px !important; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .chart-section { padding: 1rem; }
      .chart-canvas-wrap { height: 210px; }
      .chart-header { flex-direction: column; align-items: flex-start; gap: .5rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     ▶  CONFIGURATION
     ════════════════════════════════════════════════════════════

  HISTORY FEEDS SETUP (new in index2.html):
  For Carboclor tank history charts, you need two additional
  Google Sheets CSV URLs — one for UCO deliveries and one for VAO.

  Steps:
  1. Open the workbook that contains the UCO and VAO history tabs.
  2. File → Share → Publish to web.
  3. Select the UCO tab → CSV → Publish → copy URL.
  4. Paste into carboclorHistory[0].csvUrl below.
  5. Repeat for the VAO tab → paste into carboclorHistory[1].csvUrl.

  Expected CSV columns (D/M date — no year required):
  Date, Tank, Supplier, Material, Kgs, Accumulated

  CLICKING A TANK: In the Carboclor view, every tank name/number
  is a link. Clicking it opens that tank's history chart and a
  table of the last 30 days of deliveries/discharges.
  ═══════════════════════════════════════════════════════════ -->
<script>
const CONFIG = {

  /* ── Dashboard title ─────────────────────────────────────── */
  title: "Marvesa Tank Storage Dashboard",

  /* ── Facilities ──────────────────────────────────────────── */
  facilities: [
    {
      name: "Carboclor",
      csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdyOrnlQBDihM-vR3ylD5hyWkwahrugTXpi_tEeEwRxXZiNIEGlZ2VMZvwJ3gkzxHF2XNcFXMQApun/pub?gid=1509369466&single=true&output=csv",
      showHistory: true,
      historyFeeds: [
        { label: "UCO", csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdyOrnlQBDihM-vR3ylD5hyWkwahrugTXpi_tEeEwRxXZiNIEGlZ2VMZvwJ3gkzxHF2XNcFXMQApun/pub?gid=1190611792&single=true&output=csv" },
        { label: "VAO", csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdyOrnlQBDihM-vR3ylD5hyWkwahrugTXpi_tEeEwRxXZiNIEGlZ2VMZvwJ3gkzxHF2XNcFXMQApun/pub?gid=109606018&single=true&output=csv" }
      ],

<!-- ─── Application logic ────────────────────────────────── -->
<script>
/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
let allFacilityData = [];
let activeFacility  = 0;
let currentSort     = 'status';
let currentView     = window.innerWidth <= 768 ? 'cards' : 'list';
let refreshTimer    = null;
let nextRefreshAt   = null;

/* ── TPR history chart state (same as index.html) ─────────── */
let chartInstance  = null;
let chartPeriod    = '30d';
let historyCache   = {};   // url → rows (for TPR)

/* ── Carboclor sub-tab state ───────────────────────────────── */
let carboclorSubTab = 'tanks';  // 'tanks' | 'shippers'
let shippersCache   = {};       // url → normalised shipper rows (invalidated on refresh)

/* ── Tank detail state ─────────────────────────────────────── */
let historyFeedCache        = {};   // url → [{row, year, date}]
let tankFeedCache           = {};   // tankId → raw CSV rows (for per-tank feeds)
let currentDetailFacilityIdx = 0;  // which facility the open tank detail belongs to
let currentTankId     = null;
let currentTankStock  = 0;    // actual stock from main CSV for current tank
let tankTimeline      = [];   // full computed timeline for current tank
let tankChartInstance = null;
let tankChartPeriod   = '90d';


/* ══════════════════════════════════════════════════════════════
   UTILITIES
   ══════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function colVal(row, key, cols) {
  const colMap = cols || CONFIG.columns;
  const header = colMap[key] || key;
  const k = Object.keys(row).find(k => k.trim().toLowerCase() === header.toLowerCase());
  return k ? (row[k] ?? '').toString().trim() : '';
}

function fmtNum(raw) {
  const n = parseFloat((raw || '').replace(/,/g,''));
  return isNaN(n) ? raw : n.toLocaleString();
}

function parseKg(str) {
  // Handles "27,760", "-500,000", "28360" etc.
  return parseFloat(String(str || '').replace(/,/g, '').trim()) || 0;
}

function isPlaceholder(url) {
  return !url || url.includes('PASTE_YOUR');
}

function fmtDate(d) {
  if (!d) return '—';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  return `${dd}/${mm}/${yy}`;
}


/* ══════════════════════════════════════════════════════════════
   YEAR INFERENCE FOR D/M DATE FORMAT
   ══════════════════════════════════════════════════════════════
   The Carboclor history CSVs use D/M dates (no year).
   We walk BACKWARD through the rows, starting from "now",
   and decrement the year whenever we detect a large forward
   jump in the month (meaning we crossed a year boundary
   going back in time).
   ══════════════════════════════════════════════════════════════ */
function assignYears(rows, dateColIdx) {
  const now = new Date();
  let year      = now.getFullYear();
  let prevMonth = now.getMonth() + 1;  // 1-indexed

  const result = [];
  for (let i = rows.length - 1; i >= 0; i--) {
    const dateStr = String(rows[i]?.[dateColIdx] ?? '').trim();
    const parts   = dateStr.split('/');
    if (parts.length < 2) { result.unshift(null); continue; }

    const d = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    if (!d || !m || m < 1 || m > 12 || d < 1 || d > 31) { result.unshift(null); continue; }

    // Walking backward: if month jumped forward by > 3 from the previous
    // step, we crossed a year boundary going back in time → decrement year.
    if (m - prevMonth > 3) year--;
    prevMonth = m;

    let date = null;
    try { date = new Date(year, m - 1, d); } catch(e) {}

    result.unshift(date ? { row: rows[i], year, date } : null);
  }
  return result.filter(Boolean);
}


/* ══════════════════════════════════════════════════════════════
   HISTORY FEED FETCHING (Carboclor UCO / VAO)
   ══════════════════════════════════════════════════════════════ */
async function fetchHistoryFeed(url) {
  if (historyFeedCache[url]) return historyFeedCache[url];
  const resp = await fetch(url, { cache: 'no-cache' });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();
  const { data } = Papa.parse(text, { header: false, skipEmptyLines: true });
  // Skip header row (row 0); keep rows with at least 5 columns
  const dataRows = data.filter((r, i) => i > 0 && r.length >= 5);
  const annotated = assignYears(dataRows, 0);  // col 0 = Date
  historyFeedCache[url] = annotated;
  return annotated;
}

/* Get all history rows for a specific tank, merged from UCO + VAO feeds
   and any per-tank feed in tankFeedCache.                                */
async function getAllTankHistory(tankId) {
  const fac      = allFacilityData[currentDetailFacilityIdx];
  const feeds    = fac?.historyFeeds || CONFIG.carboclorHistory || [];
  const combined = [];
  for (const feed of feeds) {
    if (isPlaceholder(feed.csvUrl)) continue;
    try {
      const annotated = await fetchHistoryFeed(feed.csvUrl);
      // col 1 = Tank ID
      const tankItems = annotated.filter(
        item => String(item.row[1]).trim() === String(tankId).trim()
      );
      combined.push(...tankItems.map(item => ({ ...item, feedLabel: feed.label })));
    } catch(e) {
      console.warn(`History feed "${feed.label}" failed:`, e.message);
    }
  }

  // Per-tank feed: cols 1=Date 2=Tank 4=Supplier 5=Product 6=Tonnage
  const extraRows = tankFeedCache[String(tankId)];
  if (extraRows) {
    const histRows = extraRows.filter(r =>
      /^\d{1,2}\/\d{1,2}$/.test(String(r[1] || '').trim()) &&
      String(r[2] || '').trim() === String(tankId)
    );
    // Remap to expected format: [Date, Tank, Supplier, Product, Kgs]
    const remapped = histRows.map(r => [
      String(r[1]).trim(),
      String(r[2]).trim(),
      String(r[4]).trim(),
      String(r[5]).trim(),
      String(r[6]).trim(),
    ]);
    const annotated = assignYears(remapped, 0);
    combined.push(...annotated.map(item => ({ ...item, feedLabel: 'Extra' })));
  }

  // Sort chronologically
  combined.sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));
  return combined;
}

/* Build running-stock timeline from sorted annotated rows */
function buildTankTimeline(items) {
  let running = 0;
  return items.map(item => {
    const kgs = parseKg(item.row[4]);  // col 4 = Kgs
    running  += kgs;
    return {
      date:      item.date,
      stock:     Math.max(0, running),  // floor at 0 for display
      kgs,
      supplier:  String(item.row[2] || '').trim(),
      material:  String(item.row[3] || '').trim(),
      feedLabel: item.feedLabel || ''
    };
  });
}

/* Filter timeline by period (reused for both TPR and tank charts) */
function filterByPeriod(points, period) {
  if (period === 'all') return points;
  const now    = new Date();
  const cutoff = new Date(now);
  if      (period === '7d')  cutoff.setDate(now.getDate() - 7);
  else if (period === '30d') cutoff.setDate(now.getDate() - 30);
  else if (period === '90d') cutoff.setDate(now.getDate() - 90);
  else if (period === '6m')  cutoff.setMonth(now.getMonth() - 6);
  else if (period === '1y')  cutoff.setFullYear(now.getFullYear() - 1);
  return points.filter(p => p.date >= cutoff);
}


/* ══════════════════════════════════════════════════════════════
   CHART COLORS (shared by TPR and tank charts)
   ══════════════════════════════════════════════════════════════ */
function chartColors() {
  const dark = document.documentElement.classList.contains('dark');
  return {
    text:    dark ? '#e2e8f0' : '#1a202c',
    muted:   dark ? '#8892a4' : '#64748b',
    border:  dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.07)',
    stock:   '#16a34a',
    stockBg: dark ? 'rgba(22,163,74,.15)' : 'rgba(22,163,74,.10)',
    cap:     dark ? 'rgba(255,255,255,.25)' : 'rgba(100,116,139,.4)',
  };
}


/* ══════════════════════════════════════════════════════════════
   TANK DETAIL — CHART
   ══════════════════════════════════════════════════════════════ */
function buildTankChartJS(points, capacity) {
  const canvas = document.getElementById('detail-history-canvas');
  if (!canvas) return;
  if (tankChartInstance) { tankChartInstance.destroy(); tankChartInstance = null; }

  const c = chartColors();

  tankChartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'Stock (kg)',
          data: points.map(p => ({ x: p.date, y: p.stock })),
          borderColor: c.stock,
          backgroundColor: c.stockBg,
          fill: true,
          tension: 0.2,
          pointRadius: points.length > 150 ? 0 : 3,
          pointHoverRadius: 6,
          borderWidth: 2,
        },
        ...(capacity > 0 ? [{
          label: 'Capacity',
          data: points.length
            ? [{ x: points[0].date, y: capacity }, { x: points[points.length-1].date, y: capacity }]
            : [],
          borderColor: c.cap,
          borderDash: [6, 4],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
        }] : [])
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: {
            tooltipFormat: 'dd/MM/yyyy',
            minUnit: 'day',
            displayFormats: { day:'dd MMM', week:'dd MMM', month:'MMM yy', year:'yyyy' }
          },
          ticks: { color: c.muted, maxTicksLimit: 8 },
          grid:  { color: c.border },
        },
        y: {
          min: 0,
          ...(capacity > 0 ? { suggestedMax: capacity * 1.08 } : {}),
          ticks: {
            color: c.muted,
            callback: v => v >= 1000 ? (v/1000).toFixed(0) + ' MT' : v.toLocaleString()
          },
          grid: { color: c.border },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.dataset.label === 'Capacity')
                return `Capacity: ${(ctx.raw.y/1000).toFixed(0)} MT`;
              const kg  = ctx.raw.y;
              const mt  = (kg/1000).toFixed(1);
              const pct = capacity > 0 ? (kg/capacity*100).toFixed(1) : '—';
              return `Stock: ${mt} MT  (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

function updateTankChartColors() {
  if (!tankChartInstance) return;
  const c = chartColors();
  tankChartInstance.options.scales.x.ticks.color = c.muted;
  tankChartInstance.options.scales.x.grid.color  = c.border;
  tankChartInstance.options.scales.y.ticks.color = c.muted;
  tankChartInstance.options.scales.y.grid.color  = c.border;
  tankChartInstance.data.datasets[0].borderColor     = c.stock;
  tankChartInstance.data.datasets[0].backgroundColor = c.stockBg;
  if (tankChartInstance.data.datasets[1])
    tankChartInstance.data.datasets[1].borderColor = chartColors().cap;
  tankChartInstance.update();
}

function renderTankChartSection(timeline, capacity, currentStock) {
  const wrap = document.getElementById('detail-chart-canvas-wrap');
  if (!wrap) return;

  let points = filterByPeriod(timeline, tankChartPeriod);

  // Always anchor the last point to today's actual stock (from the main CSV).
  // This ensures period changes never make the chart endpoint appear different —
  // only the visible history range changes, the end value stays constant.
  if (typeof currentStock === 'number' && currentStock >= 0 && points.length > 0) {
    const today = new Date();
    const last  = points[points.length - 1];
    // Only append if last transaction was more than 1 hour ago (avoid duplicate)
    if (!last || (today - last.date) > 3_600_000) {
      points = [...points, { date: today, stock: currentStock, kgs: 0,
                             supplier: '', material: 'Current', feedLabel: '' }];
    }
  }

  // Update period buttons
  document.querySelectorAll('#detail-period-btns .period-btn').forEach(b => {
    const p = b.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    b.classList.toggle('active', p === tankChartPeriod);
  });

  if (!points.length) {
    wrap.innerHTML = '<div class="chart-loading">No data for selected period.</div>';
    const lbl = document.getElementById('detail-chart-pts');
    if (lbl) lbl.textContent = '';
    return;
  }

  wrap.innerHTML = '<canvas id="detail-history-canvas"></canvas>';
  buildTankChartJS(points, capacity);

  const lbl = document.getElementById('detail-chart-pts');
  if (lbl) lbl.textContent = `${points.length} data points`;

  // Legend
  const legend = document.getElementById('detail-chart-legend');
  if (legend) {
    legend.innerHTML = `
      <div class="legend-item">

/* ══════════════════════════════════════════════════════════════
   TANK DETAIL — ACTIVITY TABLE
   ══════════════════════════════════════════════════════════════ */
function renderActivityTable(timeline) {
  const tbody  = document.getElementById('detail-activity-tbody');
  const count  = document.getElementById('detail-activity-count');
  if (!tbody) return;

  // Last 30 days, newest first
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const recent = timeline
    .filter(p => p.date && p.date >= cutoff)
    .slice()
    .reverse();

  if (count) count.textContent = `${recent.length} entries`;

  if (!recent.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2rem">
      No activity in the last 30 days.</td></tr>`;
    return;
  }

  tbody.innerHTML = recent.map(p => {
    const isLoad      = p.kgs >= 0;
    const typeLabel   = isLoad ? '▲ Load' : '▼ Discharge';
    const typeClass   = isLoad ? 'kgs-pos' : 'kgs-neg';
    const kgsDisplay  = (isLoad ? '+' : '') + p.kgs.toLocaleString();
    const stockDisplay = p.stock.toLocaleString();
    const matLabel    = p.material || p.feedLabel || '—';

    return `<tr>
      <td>${fmtDate(p.date)}</td>
      <td><span class="${typeClass}">${typeLabel}</span></td>
      <td class="col-product">${esc(p.supplier || '—')}</td>
      <td class="col-product">${esc(matLabel)}</td>
      <td class="col-num ${typeClass}">${kgsDisplay}</td>
      <td class="col-num">${stockDisplay}</td>
    </tr>`;
  }).join('');
}


/* ══════════════════════════════════════════════════════════════
   TANK DETAIL — STAT CARDS
   ══════════════════════════════════════════════════════════════ */
function getTankCapacity(tankId) {
  const fac = allFacilityData[currentDetailFacilityIdx];
  if (!fac || !fac.tanks.length) return 0;
  const cols = fac.columns || CONFIG.columns;
  const row = fac.tanks.find(r => colVal(r,'name',cols) === String(tankId));
  if (!row) return 0;
  return parseKg(colVal(row,'capacity',cols));
}

function renderDetailStats(tankId, timeline) {
  const el = document.getElementById('detail-stats');
  if (!el) return;

  // Get current info from the active facility's CSV
  const fac  = allFacilityData[currentDetailFacilityIdx];
  const cols = fac?.columns || CONFIG.columns;
  let currentStock = 0, capacity = 0, product = '—', status = 'unknown';

  if (fac && fac.tanks.length) {
    const row = fac.tanks.find(r => colVal(r,'name',cols) === String(tankId));
    if (row) {
      currentStock = parseKg(colVal(row,'volume',cols));
      capacity     = parseKg(colVal(row,'capacity',cols));
      product      = colVal(row,'product',cols) || '—';
      status       = statusOf(row, cols);
    }
  }

  // Also show computed stock from history timeline (most recent point)
  const lastPoint = timeline.length ? timeline[timeline.length - 1] : null;
  const histStock = lastPoint ? lastPoint.stock : null;

  const pct      = capacity > 0 ? Math.min(100, currentStock / capacity * 100) : null;
  const pctDisp  = pct !== null ? pct.toFixed(1) + '%' : '—';
  const statusColor = { optimal: 'var(--green)', warning: 'var(--yellow)', loading: '#3b82f6', unknown: 'var(--muted)' }[status] || 'var(--muted)';

  el.innerHTML = `
    <div class="summary-card" style="border-left-color:${statusColor}">
      <span class="label">Current Stock</span>
      <span class="value" style="font-size:1.5rem;color:${statusColor}">${currentStock.toLocaleString()} kg</span>
    </div>
    <div class="summary-card">
      <span class="label">Capacity</span>
      <span class="value" style="font-size:1.5rem">${capacity > 0 ? capacity.toLocaleString() + ' kg' : '—'}</span>
    </div>
    <div class="summary-card">
      <span class="label">Fill %</span>
      <span class="value" style="font-size:1.5rem;color:${statusColor}">${pctDisp}</span>
    </div>`;
}

    document.getElementById('detail-activity-tbody').innerHTML =

/* ══════════════════════════════════════════════════════════════
   TPR HISTORY CHART (unchanged from index.html)
   ══════════════════════════════════════════════════════════════ */
async function fetchHistory(url) {
  if (historyCache[url]) return historyCache[url];
  const resp = await fetch(url, { cache: 'no-cache' });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();
  const { data } = Papa.parse(text, { header: false, skipEmptyLines: false });
  const dateRe = /^\d{1,2}\/\d{1,2}\/\d{4}$/;
  const rows = data.filter(r => r[1] && dateRe.test(r[1].trim()));
  historyCache[url] = rows;
  return rows;
}

function parseDateFull(str) {
  const [d, m, y] = str.trim().split('/').map(Number);
  return new Date(y, m - 1, d);
}

function getDailyPoints(rows) {
  const byDay = {};
  const now = new Date();
  const minYear = 2000, maxYear = now.getFullYear() + 1;
  rows.forEach(r => {
    const dateStr = r[1].trim();
    const val = parseFloat(r[8]);
    if (isNaN(val)) return;
    const parsed = parseDateFull(dateStr);
    const yr = parsed.getFullYear();
    if (yr < minYear || yr > maxYear) return;
    byDay[dateStr] = val;
  });
  return Object.entries(byDay)
    .map(([ds, mt]) => ({ date: parseDateFull(ds), stock: mt * 1000 }))
    .sort((a, b) => a.date - b.date);
}

function buildChartJS(points, capacity) {
  const canvas = document.getElementById('history-canvas');
  if (!canvas) return;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const c = chartColors();
  chartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'Stock (kg)',
          data: points.map(p => ({ x: p.date, y: p.stock })),
          borderColor: c.stock, backgroundColor: c.stockBg,
          fill: true, tension: 0.3,
          pointRadius: points.length > 120 ? 0 : 2, pointHoverRadius: 5, borderWidth: 2,
        },
        {
          label: 'Capacity',
          data: points.length
            ? [{ x: points[0].date, y: capacity }, { x: points[points.length-1].date, y: capacity }]
            : [],
          borderColor: c.cap, borderDash: [6,4], borderWidth: 1.5, pointRadius: 0, fill: false,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: { tooltipFormat:'dd/MM/yyyy', minUnit:'day', displayFormats:{ day:'dd MMM', week:'dd MMM', month:'MMM yy', year:'yyyy' } },
          ticks: { color: c.muted, maxTicksLimit: 8 }, grid: { color: c.border },
        },
        y: {
          min: 0, suggestedMax: capacity * 1.08,
          ticks: { color: c.muted, callback: v => (v/1000).toFixed(0) + ' MT' },
          grid: { color: c.border },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => {
          if (ctx.dataset.label === 'Capacity') return `Capacity: ${(ctx.raw.y/1000).toFixed(0)} MT`;
          const kg = ctx.raw.y, mt = (kg/1000).toFixed(1);
          const pct = capacity > 0 ? (kg/capacity*100).toFixed(1) : '—';
          return `Stock: ${mt} MT  (${pct}%)`;
        }}}
      }
    }
  });
}

function updateChartColors() {
  if (!chartInstance) return;
  const c = chartColors();
  chartInstance.options.scales.x.ticks.color = c.muted;
  chartInstance.options.scales.x.grid.color  = c.border;
  chartInstance.options.scales.y.ticks.color = c.muted;
  chartInstance.options.scales.y.grid.color  = c.border;
  chartInstance.data.datasets[0].borderColor     = c.stock;
  chartInstance.data.datasets[0].backgroundColor = c.stockBg;
  chartInstance.data.datasets[1].borderColor     = chartColors().cap;
  chartInstance.update();
}

async function renderTPRActivity(url) {
  const tbody = document.getElementById('tpr-activity-tbody');
  const countEl = document.getElementById('tpr-activity-count');
  if (!tbody) return;
  try {
    const rows = await fetchHistory(url);
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 30);
    const recent = rows
      .filter(r => {
        try { return parseDateFull(r[1]) >= cutoff; } catch { return false; }
      })
      .slice()
      .reverse();
    if (countEl) countEl.textContent = `${recent.length} transaction${recent.length !== 1 ? 's' : ''}`;
    if (!recent.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:1.5rem">No activity in the last 30 days</td></tr>`;
      return;
    }
    tbody.innerHTML = recent.map(r => {
      const dateStr  = r[1]?.trim() || '—';
      const type     = String(r[2] || '').trim();
      const supplier = String(r[3] || '').trim();
      const product  = String(r[4] || '').trim();
      const qtyMT    = parseFloat(r[5]);
      const stockMT  = parseFloat(r[8]);
      const qtyKg    = isNaN(qtyMT)   ? null : Math.round(qtyMT  * 1000);
      const stockKg  = isNaN(stockMT) ? null : Math.round(stockMT * 1000);
      const isIn     = /in/i.test(type);
      const typeIcon = isIn ? '▲ In' : '▼ Out';
      const typeColor = isIn ? 'color:var(--ok)' : 'color:var(--warn)';
      const qtySign  = isIn ? '+' : '−';
      const qtyDisp  = qtyKg !== null ? `${qtySign}${Math.abs(qtyKg).toLocaleString()} kg` : '—';
      const stockDisp = stockKg !== null ? stockKg.toLocaleString() + ' kg' : '—';
      return `<tr>
        <td style="white-space:nowrap">${esc(dateStr)}</td>
        <td style="${typeColor};font-weight:600;white-space:nowrap">${typeIcon}</td>
        <td>${esc(supplier)}</td>
        <td>${esc(product)}</td>
        <td class="col-num" style="font-variant-numeric:tabular-nums">${qtyDisp}</td>
        <td class="col-num" style="font-variant-numeric:tabular-nums">${stockDisp}</td>
      </tr>`;
    }).join('');
  } catch(e) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:1.5rem">Failed to load activity</td></tr>`;
  }
}
