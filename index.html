/* ══════════════════════════════════════════════════════════════
   STATUS / FILL HELPERS
   ══════════════════════════════════════════════════════════════ */
function fillPct(row, cols) {
  const direct = colVal(row,'pct',cols).replace(/%/g,'').replace(/,/g,'').trim();
  if (direct !== '') { const n = parseFloat(direct); if (!isNaN(n)) return Math.min(100, Math.max(0, n)); }
  const vol = parseFloat(colVal(row,'volume',cols).replace(/,/g,''));
  const cap = parseFloat(colVal(row,'capacity',cols).replace(/,/g,''));
  if (isNaN(vol) || isNaN(cap) || cap === 0) return null;
  return Math.min(100, Math.max(0, vol / cap * 100));
}

function statusOf(row, cols) {
  const manual = colVal(row,'status',cols).toLowerCase();
  if (['optimal'].includes(manual))                return 'optimal';
  if (['warning','warn','empty'].includes(manual)) return 'warning';
  const pct = fillPct(row, cols);
  if (pct === null)                                return 'unknown';
  if (pct <= 0)                                    return 'warning';
  if (pct >= CONFIG.thresholds.optimal)            return 'optimal';
  return 'loading';
}

function statusWeight(s) { return {warning:0, loading:1, unknown:2, optimal:3}[s] ?? 3; }


/* ══════════════════════════════════════════════════════════════
   SHARED FACILITY HELPERS (TPR)
   ══════════════════════════════════════════════════════════════ */
function groupByTank(rows, facCols) {
  const groups = {};
  rows.forEach(row => {
    const id = colVal(row, 'name', facCols);
    if (!groups[id]) groups[id] = [];
    groups[id].push(row);
  });
  return groups;
}

function sharedTankStatus(rows, fac) {
  const facCols = fac.columns || CONFIG.columns;
  const capacity = fac.capacity || 0;
  const totalStock = rows.reduce((sum, row) => {
    const v = parseFloat(colVal(row, 'volume', facCols).replace(/,/g,''));
    return sum + (isNaN(v) ? 0 : v);
  }, 0);
  const pct = capacity > 0 ? Math.min(100, totalStock / capacity * 100) : null;
  if (pct === null) return 'unknown';
  if (pct <= 0)     return 'warning';
  if (pct >= CONFIG.thresholds.optimal) return 'optimal';
  return 'loading';
}

function getFacilityTankStatuses(fac) {
  if (fac.error || fac.demo || !fac.tanks.length) return [];
  if (fac.type === 'shared') {
    const facCols = fac.columns || CONFIG.columns;
    return Object.values(groupByTank(fac.tanks, facCols)).map(rows => sharedTankStatus(rows, fac));
  }
  const cols = fac.columns || CONFIG.columns;
  return fac.tanks.map(row => statusOf(row, cols));
}


/* ══════════════════════════════════════════════════════════════
   DATA LOADING
   ══════════════════════════════════════════════════════════════ */
async function fetchCSV(url) {
  const resp = await fetch(url, { cache: 'no-cache' });
  if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${resp.statusText}`);
  const text = await resp.text();
  const { data } = Papa.parse(text, { header: true, skipEmptyLines: true });
  return data;
}

async function loadAll() {
  allFacilityData = [];
  for (const fac of CONFIG.facilities) {
    if (isPlaceholder(fac.csvUrl)) {
      allFacilityData.push({ ...fac, tanks: [], error: null, demo: true });
    } else {
      try {
        const tanks = await fetchCSV(fac.csvUrl);
        allFacilityData.push({ ...fac, tanks, error: null });
      } catch(e) {
        allFacilityData.push({ ...fac, tanks: [], error: e.message });
      }
    }
  }
  // Dynamically populate heatedTanks from any facility with a "Heating" column
  for (const facData of allFacilityData) {
    if (!facData.tanks.length) continue;
    const cols = facData.columns || CONFIG.columns;
    facData.tanks.forEach(row => {
      if (String(row['Heating'] || '').trim().toLowerCase() === 'yes') {
        const name = colVal(row, 'name', cols);
        if (name) CONFIG.heatedTanks.add(name);
      }
    });
  }
  await loadCarboclorExtraTanks();
}

/* ══════════════════════════════════════════════════════════════
   PER-TANK FEED LOADER (tanks with their own CSV outside main sheet)
   CSV columns (0-indexed): 0=blank 1=Date(D/M) 2=Tank 3=In/Out
                             4=Supplier 5=Product 6=Tonnage 7=Ref
                             8=OrderNo 9=Stock
   Summary row: col3=tank, col4=Cap(m3), col5=Stock(kg)
   ══════════════════════════════════════════════════════════════ */
async function loadCarboclorExtraTanks() {
  const feeds = CONFIG.carboclorTankFeeds || [];
  if (!feeds.length) return;
  const carbFac = allFacilityData.find(f => f.showHistory);
  if (!carbFac) return;
  tankFeedCache = {};

  for (const feed of feeds) {
    if (isPlaceholder(feed.csvUrl)) continue;
    try {
      const resp = await fetch(feed.csvUrl, { cache: 'no-cache' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      const { data } = Papa.parse(text, { header: false, skipEmptyLines: true });

      // Summary row: tank ID in col 13, Cap m3 in col 14, Stock kg in col 15
      const summaryRow = data.find(r => String(r[13] || '').trim() === String(feed.tank));
      const stockKg    = summaryRow ? parseKg(summaryRow[15]) : 0;
      const capM3      = summaryRow ? parseKg(summaryRow[14]) : 0;
      const capKg      = Math.round(capM3 * 910);  // approx density 910 kg/m³

      // First product name from history rows (col 1 = D/M date, col 5 = product)
      const histRows = data.filter(r => /^\d{1,2}\/\d{1,2}$/.test(String(r[1] || '').trim()));
      const product  = histRows.length ? String(histRows[0][5] || '').trim() : '';

      // Inject synthetic row into Carboclor using its column names
      const cols = CONFIG.columns;
      const synRow = {
        [cols.name]:     String(feed.tank),
        [cols.product]:  product,
        [cols.capacity]: String(capKg),
        [cols.volume]:   String(stockKg),
        [cols.status]:   '',
        [cols.pct]:      ''
      };
      carbFac.tanks = carbFac.tanks.filter(r => colVal(r, 'name') !== String(feed.tank));
      carbFac.tanks.push(synRow);

      // Cache raw CSV rows for history lookup
      tankFeedCache[String(feed.tank)] = data;
    } catch(e) {
      console.warn(`Per-tank feed "${feed.tank}" failed:`, e.message);
    }
  }
}


/* ══════════════════════════════════════════════════════════════
   RENDERING — HEADER / SUMMARY / TABS
   ══════════════════════════════════════════════════════════════ */
function renderHeader() {
  document.getElementById('header-title').textContent = CONFIG.title;
  document.title = CONFIG.title;
}

function renderSummary() {
  const statuses = allFacilityData.flatMap(f => getFacilityTankStatuses(f));
  document.getElementById('summary-total').textContent   = statuses.length || '—';
  document.getElementById('summary-optimal').textContent = statuses.filter(s => s==='optimal').length;
  document.getElementById('summary-warning').textContent = statuses.filter(s => s==='warning').length;
  document.getElementById('summary-loading').textContent = statuses.filter(s => s==='loading').length;
}

function renderTabs() {
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  allFacilityData.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === activeFacility ? ' active' : '');
    const warnCount = getFacilityTankStatuses(f).filter(s => s==='warning').length;
    const histBadge = f.showHistory ? `<span class="history-hint">history</span>` : '';
    btn.innerHTML = esc(f.name) + (warnCount ? ` (${warnCount} ⚠)` : '') + histBadge;
    btn.onclick = () => {
      activeFacility  = i;
      carboclorSubTab = 'tanks';  // reset sub-tab when switching facility
      renderTabs();
      renderTankGrid();
    };
    wrap.appendChild(btn);
  });

  // Show sub-tabs for any facility that has a shippers URL
  const fac = allFacilityData[activeFacility];
  const showSub = !!(fac?.shippersUrl);
  document.getElementById('subtabs-row').style.display = showSub ? '' : 'none';
  document.getElementById('sort-row').style.display    = (!showSub || carboclorSubTab === 'tanks') ? '' : 'none';
  // Sync sub-tab button states
  document.getElementById('subtab-tanks')?.classList.toggle('active',    carboclorSubTab === 'tanks');
  document.getElementById('subtab-shippers')?.classList.toggle('active', carboclorSubTab === 'shippers');
}


/* ══════════════════════════════════════════════════════════════
   RENDERING — TANK GRID
   ══════════════════════════════════════════════════════════════ */
function renderTankGrid() {
  const wrap  = document.getElementById('tanks-container');
  const query = (document.getElementById('search-input').value || '').toLowerCase();
  const fac   = allFacilityData[activeFacility];
  destroyChart();
  wrap.innerHTML = '';

  // Route to shippers sub-tab if active on a facility with a shippers URL
  if (fac?.shippersUrl && carboclorSubTab === 'shippers') {
    renderShippersView();
    return;
  }

  if (!fac) return;

  if (fac.demo) {
    wrap.innerHTML = `<div class="setup-panel">
      <h2>Setup Required</h2>
      <p>Edit the <code>CONFIG</code> section at the top of this file to connect your Google Sheets data.</p>
      <ol>
        <li>Open your Google Sheet.</li>
        <li>Go to <strong>File → Share → Publish to web</strong>.</li>
        <li>Pick the correct sheet tab and select <strong>CSV</strong> as the format.</li>
        <li>Click <strong>Publish</strong>, then copy the URL.</li>
        <li>Paste it into <code>CONFIG.facilities[].csvUrl</code> and save this file.</li>
      </ol></div>`;
    return;
  }

  if (fac.error) {
    wrap.innerHTML = `<div class="error-msg"><strong>Could not load "${esc(fac.name)}".</strong><br>${esc(fac.error)}<br><br>
      Make sure the Google Sheet is published to web as CSV (<em>File → Share → Publish to web</em>).</div>`;
    return;
  }

  if (!fac.tanks.length) {
    wrap.innerHTML = `<div class="loading-msg">No rows found. Check the CSV URL and column headers in CONFIG.</div>`;
    return;
  }

  // ── Shared facility (TPR) ──
  if (fac.type === 'shared') {
    const facCols = fac.columns || CONFIG.columns;
    const groups  = groupByTank(fac.tanks, facCols);
    const filteredGroups = {};
    Object.entries(groups).forEach(([tankId, rows]) => {
      if (query) {
        const product  = colVal(rows[0], 'product', facCols).toLowerCase();
        const shippers = rows.map(r => colVal(r, 'shipper', facCols).toLowerCase()).join(' ');
        if (!tankId.toLowerCase().includes(query) && !product.includes(query) && !shippers.includes(query)) return;
      }
      filteredGroups[tankId] = rows;
    });
    if (!Object.keys(filteredGroups).length) {
      wrap.innerHTML = `<div class="no-results">No tanks match your search.</div>`;
      return;
    }
    if (currentView === 'list') {
      const tableWrap = document.createElement('div');
      tableWrap.className = 'table-wrap';
      tableWrap.appendChild(buildSharedList(filteredGroups, fac));
      wrap.appendChild(tableWrap);
    } else {
      const grid = document.createElement('div');
      grid.className = 'tank-grid';
      Object.entries(filteredGroups).forEach(([tankId, rows]) => grid.appendChild(buildSharedCard(tankId, rows, fac)));
      wrap.appendChild(grid);
    }
    renderChartSection(fac);
    return;
  }

  // ── Regular facility (Carboclor / Voxen) ──
  const facCols = fac.columns || CONFIG.columns;
  let tanks = fac.tanks.filter(row => {
    if (!query) return true;
    return colVal(row,'name',facCols).toLowerCase().includes(query) ||
           colVal(row,'product',facCols).toLowerCase().includes(query);
  });

  tanks = [...tanks].sort((a,b) => {
    if (currentSort === 'status')    return statusWeight(statusOf(a,facCols)) - statusWeight(statusOf(b,facCols));
    if (currentSort === 'fill-asc')  return (fillPct(a,facCols)??999) - (fillPct(b,facCols)??999);
    if (currentSort === 'fill-desc') return (fillPct(b,facCols)??-1)  - (fillPct(a,facCols)??-1);
    if (currentSort === 'name')      return colVal(a,'name',facCols).localeCompare(colVal(b,'name',facCols));
    return 0;
  });

  if (!tanks.length) {
    wrap.innerHTML = `<div class="no-results">No tanks match your search.</div>`;
    return;
  }

  if (currentView === 'list') {
    const tableWrap = document.createElement('div');
    tableWrap.className = 'table-wrap';
    tableWrap.appendChild(buildList(tanks, fac));
    wrap.appendChild(tableWrap);
  } else {
    const grid = document.createElement('div');
    grid.className = 'tank-grid';
    tanks.forEach(row => grid.appendChild(buildCard(row, fac)));
    wrap.appendChild(grid);
  }
}


/* ══════════════════════════════════════════════════════════════
   CARD & LIST BUILDERS — regular facility (Carboclor)
   ══════════════════════════════════════════════════════════════ */
function tankNameHtml(name, fac) {
  const heatBadge = CONFIG.heatedTanks?.has(String(name))
    ? `<span class="heat-badge" title="Heated tank">🔥</span>` : '';
  if (fac?.showHistory) {
    return `<a href="#tank/${esc(name)}" class="tank-link">${esc(name)}</a>${heatBadge}`;
  }
  return esc(name) + heatBadge;
}

function buildCard(row, fac) {
  const cols    = fac.columns || CONFIG.columns;
  const status  = statusOf(row, cols);
  const pct     = fillPct(row, cols);
  const name    = colVal(row,'name', cols)     || 'Unnamed Tank';
  const product = colVal(row,'product', cols)  || '';
  const vol     = fmtNum(colVal(row,'volume', cols));
  const cap     = fmtNum(colVal(row,'capacity', cols));
  const unit    = colVal(row,'unit', cols) || CONFIG.defaultUnit || '';
  const unitStr = unit ? ` ${unit}` : '';

  const card      = document.createElement('div');
  card.className  = `tank-card${(status==='optimal'||status==='warning')?' '+status:''}`;
  const pctDisp   = pct !== null ? pct.toFixed(1) + '%' : '—';
  const barWidth  = pct !== null ? pct.toFixed(1) : 0;
  const chip      = (status==='optimal'||status==='warning') ? `<span class="status-chip">${status}</span>` : '';
  const volLine   = (vol && cap) ? `${vol}${unitStr} / ${cap}${unitStr}` : vol ? `${vol}${unitStr}` : '';

  card.innerHTML = `
    ${chip}
    <div class="tank-name">${tankNameHtml(name, fac)}</div>
    ${product ? `<span class="product-badge">${esc(product)}</span>` : ''}
    <div class="fill-bar-bg"><div class="fill-bar" style="width:${barWidth}%"></div></div>
    <div class="fill-pct">${pctDisp}</div>
    ${volLine ? `<div class="fill-vols">${esc(volLine)}</div>` : ''}`;
  return card;
}

function buildList(tanks, fac) {
  const cols  = fac.columns || CONFIG.columns;
  const table = document.createElement('table');
  table.className = 'tank-table';
  table.innerHTML = `<thead><tr>
    <th>Tank</th><th>Product / Supplier</th>
    <th class="col-num">Stock (kg)</th><th class="col-num">Capacity (kg)</th>
    <th class="col-pct">% Used</th>
  </tr></thead><tbody></tbody>`;
  const tbody = table.querySelector('tbody');

  tanks.forEach(row => {
    const status   = statusOf(row, cols);
    const pct      = fillPct(row, cols);
    const name     = colVal(row,'name', cols)     || '—';
    const product  = colVal(row,'product', cols)  || '—';
    const vol      = fmtNum(colVal(row,'volume', cols));
    const cap      = fmtNum(colVal(row,'capacity', cols));
    const pctDisp  = pct !== null ? pct.toFixed(2) + '%' : '—';
    const barWidth = pct !== null ? pct.toFixed(1) : 0;
    const chip     = (status==='optimal'||status==='warning')
                     ? `<span class="row-status-chip ${status}">${status}</span>` : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="col-tank">${tankNameHtml(name, fac)}${chip}</td>
      <td class="col-product">${esc(product)}</td>
      <td class="col-num">${esc(vol)}</td>
      <td class="col-num">${esc(cap)}</td>
      <td class="col-pct">
        <div class="pct-cell">
          <div class="pct-track"><div class="pct-fill ${status}" style="width:${barWidth}%"></div></div>
          <span class="pct-label ${status}">${pctDisp}</span>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
  return table;
}


/* ══════════════════════════════════════════════════════════════
   CARD & LIST BUILDERS — shared facility (TPR)
   ══════════════════════════════════════════════════════════════ */
function buildSharedList(groups, fac) {
  const facCols  = fac.columns || CONFIG.columns;
  const unit     = fac.defaultUnit || CONFIG.defaultUnit || '';
  const unitStr  = unit ? ` ${unit}` : '';
  const capacity = fac.capacity || 0;

  const table = document.createElement('table');
  table.className = 'tank-table';
  table.innerHTML = `<thead><tr>
    <th>Tank</th>
    <th class="col-shared-meta">Product</th>
    <th class="col-shared-meta">Vessel</th>
    <th>Shipper</th>
    <th class="col-num">Stock (kg)</th>
    <th class="col-num">Nominated (kg)</th>
    <th class="col-pct">% Used</th>
  </tr></thead><tbody></tbody>`;
  const tbody = table.querySelector('tbody');

  Object.entries(groups).forEach(([tankId, rows]) => {
    const totalStock = rows.reduce((sum, row) => {
      const v = parseFloat(colVal(row,'volume',facCols).replace(/,/g,''));
      return sum + (isNaN(v) ? 0 : v);
    }, 0);
    const pct     = capacity > 0 ? Math.min(100, totalStock / capacity * 100) : null;
    const status  = sharedTankStatus(rows, fac);
    const product = colVal(rows[0], 'product', facCols);
    const vessels = [...new Set(rows.map(r => colVal(r,'vessel',facCols)).filter(Boolean))].join(', ');
    const pctDisp  = pct !== null ? pct.toFixed(1) + '%' : '—';
    const barWidth = pct !== null ? pct.toFixed(1) : 0;
    const chip = (status==='optimal'||status==='warning')
                 ? `<span class="row-status-chip ${status}">${status}</span>` : '';

    const summaryTr = document.createElement('tr');
    summaryTr.className = 'shared-summary-row';
    summaryTr.innerHTML = `
      <td class="col-tank">Tank ${esc(tankId)}${chip}<span class="mobile-stock">${totalStock.toLocaleString()}${esc(unitStr)} / ${capacity > 0 ? capacity.toLocaleString()+esc(unitStr) : '—'}</span></td>
      <td class="col-product col-shared-meta">${esc(product)}</td>
      <td class="col-product col-shared-meta">${esc(vessels)}</td>
      <td class="col-product" style="color:var(--muted)">— total —</td>
      <td class="col-num">${totalStock.toLocaleString()}${esc(unitStr)}</td>
      <td class="col-num">${capacity.toLocaleString()}${esc(unitStr)}</td>
      <td class="col-pct">
        <div class="pct-cell">
          <div class="pct-track"><div class="pct-fill ${status}" style="width:${barWidth}%"></div></div>
          <span class="pct-label ${status}">${pctDisp}</span>
        </div>
      </td>`;
    tbody.appendChild(summaryTr);

    rows.forEach(row => {
      const shipper      = colVal(row,'shipper',facCols);
      const stockNum     = parseFloat(colVal(row,'volume',facCols).replace(/,/g,'')) || 0;
      const nominatedNum = parseFloat(colVal(row,'nominated',facCols).replace(/,/g,'')) || 0;
      const diff         = stockNum - nominatedNum;
      let rowClass = '';
      if      (diff < -100000)         rowClass = 'ship-row-under';
      else if (Math.abs(diff) <= 5000) rowClass = 'ship-row-ok';
      else if (diff > 10000)           rowClass = 'ship-row-over';
      const sPct      = nominatedNum > 0 ? Math.min(200, stockNum / nominatedNum * 100) : null;
      const sPctDisp  = sPct !== null ? sPct.toFixed(1) + '%' : '—';
      const sBarWidth = sPct !== null ? Math.min(100, sPct).toFixed(1) : 0;
      const sStatus   = sPct !== null && sPct >= 95 ? 'optimal' : 'loading';
      const tr = document.createElement('tr');
      tr.className = rowClass;
      tr.innerHTML = `
        <td></td>
        <td class="col-shared-meta"></td>
        <td class="col-shared-meta"></td>
        <td class="col-tank shipper-indent">↳ ${esc(shipper)}<span class="mobile-stock">${stockNum.toLocaleString()}${esc(unitStr)}</span></td>
        <td class="col-num">${fmtNum(colVal(row,'volume',facCols))}${esc(unitStr)}</td>
        <td class="col-num">${fmtNum(colVal(row,'nominated',facCols))}${esc(unitStr)}</td>
        <td class="col-pct">
          <div class="pct-cell">
            <div class="pct-track"><div class="pct-fill ${sStatus}" style="width:${sBarWidth}%"></div></div>
            <span class="pct-label ${sStatus}">${sPctDisp}</span>
          </div>
        </td>`;
      tbody.appendChild(tr);
    });
  });
  return table;
}

function buildSharedCard(tankId, rows, fac) {
  const facCols  = fac.columns || CONFIG.columns;
  const unit     = fac.defaultUnit || CONFIG.defaultUnit || '';
  const unitStr  = unit ? ` ${unit}` : '';
  const capacity = fac.capacity || 0;
  const totalStock = rows.reduce((sum, row) => {
    const v = parseFloat(colVal(row,'volume',facCols).replace(/,/g,''));
    return sum + (isNaN(v) ? 0 : v);
  }, 0);
  const pct     = capacity > 0 ? Math.min(100, totalStock / capacity * 100) : null;
  const status  = sharedTankStatus(rows, fac);
  const product = colVal(rows[0],'product',facCols);
  const vessels = [...new Set(rows.map(r => colVal(r,'vessel',facCols)).filter(Boolean))].join(', ');
  const pctDisp  = pct !== null ? pct.toFixed(1) + '%' : '—';
  const barWidth = pct !== null ? pct.toFixed(1) : 0;
  const chip     = (status==='optimal'||status==='warning') ? `<span class="status-chip">${status}</span>` : '';

  const shipperRows = rows.map(row => {
    const shipper      = colVal(row,'shipper',facCols);
    const stock        = fmtNum(colVal(row,'volume',facCols));
    const nominated    = fmtNum(colVal(row,'nominated',facCols));
    const stockNum     = parseFloat(colVal(row,'volume',facCols).replace(/,/g,'')) || 0;
    const nominatedNum = parseFloat(colVal(row,'nominated',facCols).replace(/,/g,'')) || 0;
    const diff         = stockNum - nominatedNum;
    let rowClass = '';
    if      (diff < -100000)         rowClass = 'ship-row-under';
    else if (Math.abs(diff) <= 5000) rowClass = 'ship-row-ok';
    else if (diff > 10000)           rowClass = 'ship-row-over';
    return `<tr class="${rowClass}"><td>${esc(shipper)}</td><td>${esc(stock)}${esc(unitStr)}</td><td>${esc(nominated)}${esc(unitStr)}</td></tr>`;
  }).join('');

  const card = document.createElement('div');
  card.className = `tank-card shared-card${(status==='optimal'||status==='warning')?' '+status:''}`;
  card.innerHTML = `
    ${chip}
    <div class="shared-header">
      <div>
        <div class="tank-name">Tank ${esc(tankId)}</div>
        ${product ? `<span class="product-badge">${esc(product)}</span>` : ''}
      </div>
      ${vessels ? `<div class="vessel-badge">⛴ ${esc(vessels)}</div>` : ''}
    </div>
    <div class="fill-bar-bg"><div class="fill-bar" style="width:${barWidth}%"></div></div>
    <div class="shared-fill-row">
      <span class="fill-pct">${pctDisp}</span>
      <span class="fill-vols">${totalStock.toLocaleString()}${esc(unitStr)} / ${capacity.toLocaleString()}${esc(unitStr)}</span>
    </div>
    <table class="shipper-table">
      <thead><tr><th>Shipper</th><th>Stock</th><th>Nominated</th></tr></thead>
      <tbody>${shipperRows}</tbody>
    </table>`;
  return card;
}


/* ══════════════════════════════════════════════════════════════
   CARBOCLOR SHIPPERS SUB-TAB
   ══════════════════════════════════════════════════════════════ */

/* Switch between Tanks and Shippers sub-tabs */
function setSubTab(tab) {
  carboclorSubTab = tab;
  document.getElementById('subtab-tanks')?.classList.toggle('active',    tab === 'tanks');
  document.getElementById('subtab-shippers')?.classList.toggle('active', tab === 'shippers');
  // Sort row only makes sense in the Tanks view
  document.getElementById('sort-row').style.display = tab === 'tanks' ? '' : 'none';
  renderTankGrid();
}

/* Fetch and normalise the shipper CSV for a given facility (cached by URL) */
async function fetchFacilityShippers(fac) {
  const url = fac?.shippersUrl;
  if (!url || isPlaceholder(url)) return [];
  if (shippersCache[url]) return shippersCache[url];
  const sc   = fac.shippersColumns || {};
  const resp = await fetch(url, { cache: 'no-cache' });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();
  const { data } = Papa.parse(text, { header: true, skipEmptyLines: true });
  // Map facility-specific column names → internal keys; drop Total rows
  shippersCache[url] = data
    .filter(r => {
      const p = String(r[sc.product || 'Product'] || '').trim();
      return p && p.toLowerCase() !== 'total';
    })
    .map(r => ({
      Product:   String(r[sc.product   || 'Product']                     || '').trim(),
      Shipper:   String(r[sc.shipper   || 'Shipper']                     || '').trim(),
      Stock:     String(r[sc.stock     || 'Stock']                       || '0').trim(),
      Nominated: String(r[sc.nominated || 'Nominted'] || r['Nominated']  || '0').trim(),
      Vessel:    String(r[sc.vessel    || 'Vessel']                      || '').trim(),
    }));
  return shippersCache[url];
}

/* Top-level render for the Shippers sub-tab */
async function renderShippersView() {
  const wrap = document.getElementById('tanks-container');
  const fac  = allFacilityData[activeFacility];
  wrap.innerHTML = '<div class="loading-msg">Loading shipper data…</div>';
  try {
    const rows = await fetchFacilityShippers(fac);
    // Group by Product (preserve insertion order)
    const groups = {};
    rows.forEach(r => {
      if (!groups[r.Product]) groups[r.Product] = [];
      groups[r.Product].push(r);
    });

    wrap.innerHTML = '';
    if (currentView === 'list') {
      const tw = document.createElement('div');
      tw.className = 'table-wrap';
      tw.appendChild(buildShippersList(groups));
      wrap.appendChild(tw);
    } else {
      const grid = document.createElement('div');
      grid.className = 'tank-grid';
      Object.entries(groups).forEach(([product, pRows]) =>
        grid.appendChild(buildShippersCard(product, pRows))
      );
      wrap.appendChild(grid);
    }
  } catch(e) {
    wrap.innerHTML = `<div class="error-msg"><strong>Could not load shipper data.</strong><br>${esc(e.message)}</div>`;
  }
}

/* Helper: parse a kg string that may have commas */
function parseShipperKg(s) {
  return parseFloat(String(s || '0').replace(/,/g, '').trim()) || 0;
}

/* Helper: status colour based on stock vs nominated */
function shipperRowStatus(stock, nominated) {
  if (nominated <= 0) return 'unknown';
  const pct = stock / nominated * 100;
  if (pct >= 95) return 'optimal';
  if (pct > 0)   return 'loading';
  return 'warning';
}

/* Build the list/table view for the Shippers sub-tab */
function buildShippersList(groups) {
  const table = document.createElement('table');
  table.className = 'tank-table';
  table.innerHTML = `<thead><tr>
    <th>Product / Shipper</th>
    <th class="col-num">Stock (kg)</th>
    <th class="col-num">Nominated (kg)</th>
    <th>Vessel</th>
    <th class="col-pct">% Nominated</th>
  </tr></thead><tbody></tbody>`;
  const tbody = table.querySelector('tbody');

  Object.entries(groups).forEach(([product, rows]) => {
    const totalStock     = rows.reduce((s, r) => s + parseShipperKg(r.Stock),     0);
    const totalNominated = rows.reduce((s, r) => s + parseShipperKg(r.Nominated), 0);
    const pct      = totalNominated > 0 ? Math.min(200, totalStock / totalNominated * 100) : null;
    const pctDisp  = pct !== null ? pct.toFixed(1) + '%' : '—';
    const barWidth = pct !== null ? Math.min(100, pct).toFixed(1) : 0;
    const status   = pct === null ? 'unknown' : pct >= 95 ? 'optimal' : pct > 0 ? 'loading' : 'warning';

    // Product summary row
    const summaryTr = document.createElement('tr');
    summaryTr.className = 'shared-summary-row';
    summaryTr.innerHTML = `
      <td class="col-tank">${esc(product)}<span class="mobile-stock"> ${totalStock.toLocaleString()} kg</span></td>
      <td class="col-num">${totalStock.toLocaleString()} kg</td>
      <td class="col-num">${totalNominated > 0 ? totalNominated.toLocaleString() + ' kg' : '—'}</td>
      <td style="color:var(--muted)">—</td>
      <td class="col-pct">
        <div class="pct-cell">
          <div class="pct-track"><div class="pct-fill ${status}" style="width:${barWidth}%"></div></div>
          <span class="pct-label ${status}">${pctDisp}</span>
        </div>
      </td>`;
    tbody.appendChild(summaryTr);

    // Shipper rows
    rows.forEach(r => {
      const stock     = parseShipperKg(r.Stock);
      const nominated = parseShipperKg(r.Nominated);
      const sPct      = nominated > 0 ? Math.min(200, stock / nominated * 100) : null;
      const sPctDisp  = sPct !== null ? sPct.toFixed(1) + '%' : '—';
      const sBarWidth = sPct !== null ? Math.min(100, sPct).toFixed(1) : 0;
      const sStatus   = shipperRowStatus(stock, nominated);
      // Row colour: green = ok, yellow = under-nominated, red = over-nominated
      let rowClass = '';
      if (nominated > 0) {
        const diff = stock - nominated;
        if      (diff < -50000)          rowClass = 'ship-row-under';
        else if (Math.abs(diff) <= 5000) rowClass = 'ship-row-ok';
        else if (diff > 50000)           rowClass = 'ship-row-over';
      }
      const tr = document.createElement('tr');
      tr.className = rowClass;
      tr.innerHTML = `
        <td class="col-tank shipper-indent">↳ ${esc(r.Shipper)}<span class="mobile-stock"> ${stock.toLocaleString()} kg</span></td>
        <td class="col-num">${stock.toLocaleString()} kg</td>
        <td class="col-num">${nominated > 0 ? nominated.toLocaleString() + ' kg' : '—'}</td>
        <td class="col-product">${esc(r.Vessel || '—')}</td>
        <td class="col-pct">
          <div class="pct-cell">
            <div class="pct-track"><div class="pct-fill ${sStatus}" style="width:${sBarWidth}%"></div></div>
            <span class="pct-label ${sStatus}">${sPctDisp}</span>
          </div>
        </td>`;
      tbody.appendChild(tr);
    });
  });
  return table;
}

/* Build a card for one product group in the Shippers sub-tab */
function buildShippersCard(product, rows) {
  const totalStock     = rows.reduce((s, r) => s + parseShipperKg(r.Stock),     0);
  const totalNominated = rows.reduce((s, r) => s + parseShipperKg(r.Nominated), 0);
  const pct      = totalNominated > 0 ? Math.min(100, totalStock / totalNominated * 100) : null;
  const pctDisp  = pct !== null ? pct.toFixed(1) + '%' : '—';
  const barWidth = pct !== null ? pct.toFixed(1) : 0;
  const status   = pct === null ? 'unknown' : pct >= 95 ? 'optimal' : pct > 0 ? 'loading' : 'warning';

  const shipperRows = rows.map(r => {
    const stock     = parseShipperKg(r.Stock);
    const nominated = parseShipperKg(r.Nominated);
    const diff      = stock - nominated;
    let rowClass = '';
    if (nominated > 0) {
      if      (diff < -50000)          rowClass = 'ship-row-under';
      else if (Math.abs(diff) <= 5000) rowClass = 'ship-row-ok';
      else if (diff > 50000)           rowClass = 'ship-row-over';
    }
    return `<tr class="${rowClass}">
      <td>${esc(r.Shipper)}</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums">${stock.toLocaleString()} kg</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums">${nominated > 0 ? nominated.toLocaleString() + ' kg' : '—'}</td>
    </tr>`;
  }).join('');

  // Unique vessels for this product
  const vessels = [...new Set(rows.map(r => r.Vessel).filter(v => v && v !== '??'))].join(', ');

  const card = document.createElement('div');
  card.className = `tank-card shared-card${status === 'optimal' ? ' optimal' : status === 'warning' ? ' warning' : ''}`;
  card.innerHTML = `
    <div class="shared-header">
      <div>
        <div class="tank-name">${esc(product)}</div>
        <span class="product-badge">${rows.length} shipper${rows.length !== 1 ? 's' : ''}</span>
      </div>
      ${vessels ? `<div class="vessel-badge">⛴ ${esc(vessels)}</div>` : ''}
    </div>
    <div class="fill-bar-bg"><div class="fill-bar" style="width:${barWidth}%"></div></div>
    <div class="shared-fill-row">
      <span class="fill-pct">${pctDisp}</span>
      <span class="fill-vols">${totalStock.toLocaleString()} kg / ${totalNominated > 0 ? totalNominated.toLocaleString() + ' kg nom.' : '—'}</span>
    </div>
    <table class="shipper-table">
      <thead><tr><th>Shipper</th><th style="text-align:right">Stock</th><th style="text-align:right">Nominated</th></tr></thead>
      <tbody>${shipperRows}</tbody>
    </table>`;
  return card;
}


/* ══════════════════════════════════════════════════════════════
   SORT CONTROLS
   ══════════════════════════════════════════════════════════════ */
function setSort(key) {
  currentSort = key;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-' + key)?.classList.add('active');
  renderTankGrid();
}


/* ══════════════════════════════════════════════════════════════
   REFRESH & TIMING
   ══════════════════════════════════════════════════════════════ */
function updateTimestamps() {
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function tickCountdown() {
  const el = document.getElementById('next-refresh');
  if (!el || !nextRefreshAt) return;
  const secs = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
  const m = Math.floor(secs/60), s = secs%60;
  el.textContent = `Next refresh in ${m}:${s.toString().padStart(2,'0')}`;
}

async function doRefresh() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true; btn.textContent = '⟳ Loading…';
  await loadAll();
  renderSummary();
  renderTabs();
  // Only re-render main grid if we're on the main view
  if (document.getElementById('main-content').style.display !== 'none') {
    renderTankGrid();
  }
  updateTimestamps();
  nextRefreshAt = Date.now() + CONFIG.refreshMinutes * 60 * 1000;
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(doRefresh, CONFIG.refreshMinutes * 60 * 1000);
  btn.disabled = false; btn.textContent = '⟳ Refresh';
}

function manualRefresh() {
  clearTimeout(refreshTimer);
  // Also clear history feed cache so fresh data is fetched
  historyFeedCache = {};
  historyCache     = {};
  shippersCache    = {};
  tankFeedCache    = {};
  doRefresh();
}


/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
async function init() {
  // Restore dark mode
  if (localStorage.getItem('darkMode') === '1') {
    document.documentElement.classList.add('dark');
    document.getElementById('dark-toggle').textContent = '☀️';
  }

  // Sync view toggle buttons with initial view (cards on mobile, list on desktop)
  document.getElementById('view-list')?.classList.toggle('active', currentView === 'list');
  document.getElementById('view-cards')?.classList.toggle('active', currentView === 'cards');

  renderHeader();
  document.getElementById('tanks-container').innerHTML =
    '<div class="loading-msg">Loading data…</div>';

  // Load main data first, then handle route
  await doRefresh();
  handleRoute();

  setInterval(tickCountdown, 1000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
