<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tank Storage Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    /* ─── Design tokens ─────────────────────────────────────── */
    :root {
      --bg:        #f0f2f5;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --primary:   #1e3a5f;
      --primary-light: #2a4f82;
      --text:      #1a202c;
      --muted:     #64748b;
      --green:     #16a34a;
      --green-bg:  #f0fdf4;
      --yellow:    #b45309;
      --yellow-bg: #fffbeb;
      --red:       #dc2626;
      --red-bg:    #fef2f2;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    }

    /* ─── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; }
    code { font-family: 'Menlo', 'Consolas', monospace; font-size: 0.875em;
           background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 4px; }

    /* ─── Header ─────────────────────────────────────────────── */
    .header {
      background: var(--primary);
      color: white;
      padding: 0.875rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    .header-icon { font-size: 1.5rem; }
    .header-title { font-size: 1.125rem; font-weight: 700; letter-spacing: -.01em; }
    .header-right { display: flex; align-items: center; gap: 1rem; font-size: 0.8125rem; opacity: .85; }
    .header-meta { display: flex; flex-direction: column; align-items: flex-end; gap: .1rem; }
    #last-updated { font-size: .75rem; opacity: .8; }
    #next-refresh  { font-size: .75rem; opacity: .7; }
    .refresh-btn {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: white; padding: .375rem .875rem; border-radius: 6px; cursor: pointer;
      font-size: .8125rem; transition: background .15s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,.25); }
    .refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ─── Layout ─────────────────────────────────────────────── */
    .main { padding: 1.5rem 2rem; max-width: 1500px; margin: 0 auto; }

    /* ─── Summary cards ──────────────────────────────────────── */
    .summary-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .summary-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 1.125rem 1.5rem; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: .25rem;
      border-left: 4px solid var(--border);
    }
    .summary-card .label {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    }
    .summary-card .value { font-size: 2rem; font-weight: 800; line-height: 1; color: var(--text); }
    .summary-card.s-optimal  { border-left-color: var(--green); }
    .summary-card.s-optimal  .value { color: var(--green); }
    .summary-card.s-warning  { border-left-color: var(--yellow); }
    .summary-card.s-warning  .value { color: var(--yellow); }
    .summary-card.s-loading  { border-left-color: #3b82f6; }
    .summary-card.s-loading  .value { color: #3b82f6; }

    /* ─── Toolbar (tabs + search) ────────────────────────────── */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap;
    }
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; }
    .tab {
      padding: .4375rem 1rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; font-size: .875rem; color: var(--muted);
      transition: all .15s;
    }
    .tab:hover  { border-color: var(--primary-light); color: var(--primary); }
    .tab.active { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }

    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: .625rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #search-input {
      padding: .4375rem .75rem .4375rem 2rem; border-radius: 6px;
      border: 1px solid var(--border); font-size: .875rem; width: 220px;
      background: var(--surface); color: var(--text);
    }
    #search-input:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(42,79,130,.15); }

    /* ─── Sort controls ──────────────────────────────────────── */
    .sort-row {
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: 1rem; font-size: .8125rem; color: var(--muted);
    }
    .sort-btn {
      padding: .25rem .625rem; border-radius: 5px; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer; font-size: .8125rem; color: var(--muted);
      transition: all .15s;
    }
    .sort-btn:hover  { border-color: var(--primary-light); color: var(--primary); }
    .sort-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* ─── Tank grid ───────────────────────────────────────────── */
    .tank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: .75rem;
    }

    /* ─── Tank card ───────────────────────────────────────────── */
    .tank-card {
      background: var(--surface); border-radius: var(--radius);
      padding: .75rem .875rem .7rem;
      box-shadow: var(--shadow); border-top: 3px solid var(--green);
      position: relative; transition: transform .15s, box-shadow .15s;
    }
    .tank-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .tank-card.warning { border-top-color: var(--yellow); background: var(--yellow-bg); }
    .tank-card.optimal { border-top-color: #15803d; background: var(--green-bg); }

    .tank-name { font-weight: 700; font-size: .875rem; margin-bottom: .2rem; color: var(--text); }
    .product-badge {
      display: inline-block; padding: .1rem .45rem; border-radius: 999px;
      background: #e8edf5; color: var(--primary); font-size: .7rem; font-weight: 600;
      margin-bottom: .6rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tank-card.warning  .product-badge { background: #fde68a; color: #78350f; }
    .tank-card.optimal  .product-badge { background: #bbf7d0; color: #14532d; }

    .fill-bar-bg {
      background: #e2e8f0; border-radius: 999px; height: 6px; margin-bottom: .375rem; overflow: hidden;
    }
    .fill-bar {
      height: 100%; border-radius: 999px; background: var(--green); transition: width .4s ease;
    }
    .tank-card.warning  .fill-bar { background: #d97706; }
    .tank-card.optimal  .fill-bar { background: #15803d; }

    .fill-pct  { font-weight: 800; font-size: 1rem; }
    .fill-vols { font-size: .7rem; color: var(--muted); margin-top: .1rem; opacity: .8; }

    .status-chip {
      position: absolute; top: .75rem; right: .75rem;
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; padding: .1rem .4rem; border-radius: 4px;
    }
    .tank-card.warning  .status-chip { background: #fde68a; color: #78350f; }
    .tank-card.optimal  .status-chip { background: #bbf7d0; color: #14532d; }

    /* ─── Setup / Error / Loading ────────────────────────────── */
    .setup-panel {
      background: var(--surface); border-radius: var(--radius); padding: 2.5rem 2rem;
      text-align: center; max-width: 620px; margin: 2rem auto; box-shadow: var(--shadow);
    }
    .setup-panel h2 { font-size: 1.125rem; margin-bottom: .625rem; color: var(--primary); }
    .setup-panel p  { color: var(--muted); font-size: .9rem; line-height: 1.65; margin-bottom: 1.125rem; }
    .setup-panel ol { text-align: left; font-size: .875rem; line-height: 2.1; color: var(--muted); padding-left: 1.25rem; }
    .setup-panel ol li strong { color: var(--text); }

    .error-msg {
      background: var(--red-bg); border: 1px solid #fca5a5; border-radius: var(--radius);
      padding: 1rem 1.5rem; color: var(--red); margin-bottom: 1rem; font-size: .875rem;
    }
    .loading-msg { text-align: center; padding: 3rem; color: var(--muted); font-size: .9rem; }

    .no-results {
      grid-column: 1/-1; text-align: center; padding: 2.5rem; color: var(--muted); font-size: .9rem;
    }

    /* ─── Shared tank card ────────────────────────────────────── */
    .shared-card { grid-column: span 2; }
    @media (max-width: 500px) { .shared-card { grid-column: span 1; } }

    .shared-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: .5rem;
    }
    .vessel-badge {
      font-size: .75rem; color: var(--muted); background: #f1f5f9;
      padding: .2rem .6rem; border-radius: 5px; font-weight: 500; white-space: nowrap;
    }
    .shared-fill-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: .2rem; margin-bottom: .875rem;
    }
    .shipper-table {
      width: 100%; border-collapse: collapse; font-size: .8125rem; margin-top: .25rem;
    }
    .shipper-table th {
      text-align: left; padding: .3rem .5rem;
      font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); border-bottom: 1px solid var(--border);
    }
    .shipper-table td {
      padding: .4rem .5rem; border-bottom: 1px solid rgba(0,0,0,.05); color: var(--text);
    }
    .shipper-table tr:last-child td { border-bottom: none; }
    .shipper-table td:nth-child(2),
    .shipper-table td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
    .tank-card.warning  .shipper-table th { border-bottom-color: #fde68a; }
    .tank-card.optimal  .shipper-table th { border-bottom-color: #bbf7d0; }
    .ship-row-under td { background: #fef9c3; }   /* yellow – under by >100k */
    .ship-row-ok    td { background: #d1fae5; }   /* green  – within 5k     */
    .ship-row-over  td { background: #fee2e2; }   /* red    – over by >10k  */

    /* ─── Dark mode ──────────────────────────────────────────── */
    html.dark {
      --bg:        #0d1117;
      --surface:   #161b24;
      --border:    #252d3d;
      --text:      #e2e8f0;
      --muted:     #8892a4;
      --green-bg:  #052e16;
      --yellow-bg: #1c1200;
      --red-bg:    #1c0505;
      --shadow:    0 1px 4px rgba(0,0,0,.5);
    }
    html.dark .product-badge    { background: #1e2d45; color: #7eb8f7; }
    html.dark .vessel-badge     { background: #1e2535; }
    html.dark #search-input     { background: var(--surface); color: var(--text); border-color: var(--border); }
    html.dark .row-status-chip.warning  { background: #78350f; color: #fde68a; }
    html.dark .row-status-chip.optimal  { background: #14532d; color: #bbf7d0; }
    html.dark .shipper-table td { border-bottom-color: rgba(255,255,255,.05); }
    html.dark .ship-row-under td { background: rgba(251,191,36,.12); }
    html.dark .ship-row-ok    td { background: rgba(34,197,94,.10); }
    html.dark .ship-row-over  td { background: rgba(239,68,68,.12); }

    .dark-toggle {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
      color: white; padding: .3rem .55rem; border-radius: 6px;
      cursor: pointer; font-size: 1rem; line-height: 1; transition: background .15s;
    }
    .dark-toggle:hover { background: rgba(255,255,255,.22); }

    /* ─── Table / list view ──────────────────────────────────── */
    .table-wrap {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
    }
    .tank-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .tank-table th {
      text-align: left; padding: .625rem 1rem;
      font-size: .7rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); border-bottom: 2px solid var(--border); font-weight: 600;
    }
    .tank-table td {
      padding: .7rem 1rem; border-bottom: 1px solid var(--border);
      color: var(--text); vertical-align: middle;
    }
    .tank-table tbody tr:last-child td { border-bottom: none; }
    .tank-table tbody tr:hover { background: rgba(128,128,128,.06); }

    .col-tank    { font-weight: 700; white-space: nowrap; }
    .col-product { color: var(--muted); font-size: .825rem; }
    .col-num     { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .col-pct     { width: 38%; min-width: 180px; }

    .row-status-chip {
      display: inline-block; font-size: .6rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      padding: .1rem .35rem; border-radius: 4px; margin-left: .4rem; vertical-align: middle;
    }
    .row-status-chip.warning  { background: #fde68a; color: #78350f; }
    .row-status-chip.critical { background: #fecaca; color: #7f1d1d; }

    .pct-cell  { display: flex; align-items: center; gap: .625rem; }
    .pct-track { flex: 1; height: 7px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .pct-fill  { height: 100%; border-radius: 999px; transition: width .4s ease; }
    .pct-fill.loading  { background: var(--green); }
    .pct-fill.warning  { background: #d97706; }
    .pct-fill.optimal  { background: #15803d; }
    .pct-fill.unknown  { background: var(--muted); }
    .pct-label { min-width: 3.75rem; text-align: right; font-weight: 700; font-size: .875rem; }
    .pct-label.loading  { color: var(--green); }
    .pct-label.warning  { color: #d97706; }
    .pct-label.optimal  { color: #15803d; }
    .pct-label.unknown  { color: var(--muted); }

    /* ─── Shared list view ───────────────────────────────────── */
    .shared-summary-row td {
      font-weight: 700; background: rgba(0,0,0,.025);
      border-top: 2px solid var(--border);
    }
    html.dark .shared-summary-row td { background: rgba(255,255,255,.04); }
    .shipper-indent { color: var(--muted); padding-left: 1.75rem !important; font-weight: 400; font-size: .8rem; }

    /* ─── History chart ──────────────────────────────────────── */
    .chart-section {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 1.25rem 1.5rem; margin-top: 1.25rem;
    }
    .chart-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; flex-wrap: wrap; gap: .5rem;
    }
    .chart-title { font-size: .9rem; font-weight: 700; color: var(--text); }
    .chart-title span { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: .4rem; }
    .period-btns { display: flex; gap: .3rem; flex-wrap: wrap; }
    .period-btn {
      padding: .2rem .55rem; border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: .75rem;
      cursor: pointer; transition: all .15s;
    }
    .period-btn:hover  { border-color: var(--primary-light); color: var(--primary); }
    .period-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
    .chart-canvas-wrap { position: relative; height: 300px; }
    .chart-loading { text-align: center; padding: 2rem; color: var(--muted); font-size: .875rem; }
    .chart-legend {
      display: flex; gap: 1.25rem; margin-top: .75rem; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: .35rem; font-size: .75rem; color: var(--muted); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-line { width: 20px; height: 2px; flex-shrink: 0; }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 900px)  { .main { padding: 1rem; } .summary-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 700px)  {
      .tank-table .col-num { display: none; }
      .col-pct { min-width: 120px; }
    }
    @media (max-width: 600px)  {
      /* ── Header ── */
      .header { padding: .75rem 1rem; }
      .header-title { font-size: .875rem; }
      .header-meta { display: none; }          /* hide "Updated…" & countdown */

      /* ── Summary / toolbar ── */
      .summary-grid { grid-template-columns: repeat(2,1fr); gap: .625rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      #search-input { width: 100%; }

      /* ── Sort row ── */
      .sort-row { flex-wrap: wrap; row-gap: .4rem; }
      .sort-btn  { white-space: nowrap; }        /* stop "Fill %" from breaking */
      .sort-row > span { margin-left: 0 !important; } /* un-push view toggle */

      /* ── Cards ── */
      .tank-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: .75rem; }

      /* ── Shared TPR table: hide Product & Vessel columns ── */
      .col-shared-meta { display: none; }
      .col-pct { min-width: 90px !important; }

      /* ── Table horizontal scroll fallback ── */
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

      /* ── Chart ── */
      .chart-section { padding: 1rem; }
      .chart-canvas-wrap { height: 210px; }
      .chart-header { flex-direction: column; align-items: flex-start; gap: .5rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     ▶  CONFIGURATION  — edit this section, then save.
     ════════════════════════════════════════════════════════════

  HOW TO GET YOUR GOOGLE SHEET CSV URL:
  1. Open your Google Sheet.
  2. File → Share → Publish to web.
  3. Under "Link", select the specific sheet tab.
  4. Change the format dropdown to "Comma-separated values (.csv)".
  5. Click Publish → OK.
  6. Copy the URL that appears and paste it below.

  Repeat for each facility sheet.
  ═══════════════════════════════════════════════════════════ -->
<script>
const CONFIG = {

  /* ── Dashboard title ─────────────────────────────────────── */
  title: "Marvesa Tank Storage Dashboard",

  /* ── One entry per facility / Google Sheet ───────────────── */
  facilities: [
    {
      name: "Carboclor",
      csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdyOrnlQBDihM-vR3ylD5hyWkwahrugTXpi_tEeEwRxXZiNIEGlZ2VMZvwJ3gkzxHF2XNcFXMQApun/pub?gid=1509369466&single=true&output=csv"
      // uses global CONFIG.columns and CONFIG.defaultUnit below
    },
    {
      name: "TPR",
      csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdyOrnlQBDihM-vR3ylD5hyWkwahrugTXpi_tEeEwRxXZiNIEGlZ2VMZvwJ3gkzxHF2XNcFXMQApun/pub?gid=1557124348&single=true&output=csv",

      // "shared" = multiple rows per tank (one per shipper), grouped into one card
      type: "shared",

      // Total physical capacity of Tank 32 in kg  (1,380 MT = 1,380,000 kg)
      capacity: 1380000,

      // Column headers specific to this sheet
      columns: {
        name:      "Tank",
        product:   "Product",
        volume:    "Stock",           // current stock per shipper
        shipper:   "Shipper",
        vessel:    "Vessel",
        nominated: "Nominated Qtty KG"
      },
      defaultUnit: "kg",

      // ── History tab: "Tank 32" sheet published as CSV ─────────
      // File → Share → Publish to web → select "Tank 32" tab → CSV
      historyUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIu2Ftq3WV5oNIJjgCti8sQHjeKb9huwz3icRuf-ARnkiuLm17h40sRgDqDgbY7wIVo1Y62xKtcBFF/pub?gid=0&single=true&output=csv"
    }
  ],

  /* ── Column header names in your Google Sheet ────────────── */
  /* Change these values to match whatever headings you use.    */
  columns: {
    name:     "Tank",             // tank name or ID
    product:  "Product/Supplier", // stored product + supplier
    capacity: "Capacity_Kg",      // maximum capacity in kg
    volume:   "Stocl_ Kg",        // current stock in kg
    unit:     "",                 // no unit column — use defaultUnit below
    status:   "Status",           // optional manual override column
    pct:      "% Used"            // pre-calculated fill percentage column
  },

  /* ── Default unit shown on cards when no unit column exists ─ */
  defaultUnit: "kg",

  /* ── Alert thresholds (fill %) ───────────────────────────── */
  /* 100% = full (goal = Optimal), 0% = empty (problem = Warning) */
  thresholds: {
    optimal: 95    // above this → Optimal (full tanks are the goal)
    // Warning fires at exactly 0% (empty tank)
  },

  /* ── Auto-refresh interval in minutes ───────────────────── */
  refreshMinutes: 5

};
</script>
<!-- ═══════════════════════════════════════════════════════════ -->


<!-- ─── HTML structure ─────────────────────────────────────── -->
<header class="header">
  <div class="header-left">
    <span class="header-icon">🏭</span>
    <span class="header-title" id="header-title">Tank Storage Dashboard</span>
  </div>
  <div class="header-right">
    <div class="header-meta">
      <span id="last-updated">Not yet loaded</span>
      <span id="next-refresh"></span>
    </div>
    <button class="dark-toggle" id="dark-toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()">⟳ Refresh</button>
  </div>
</header>

<main class="main">
  <!-- Summary cards -->
  <div class="summary-grid">
    <div class="summary-card">
      <span class="label">Total Tanks</span>
      <span class="value" id="summary-total">—</span>
    </div>
    <div class="summary-card s-optimal">
      <span class="label">✓ Optimal</span>
      <span class="value" id="summary-optimal">0</span>
    </div>
    <div class="summary-card s-warning">
      <span class="label">⚠ Warning</span>
      <span class="value" id="summary-warning">0</span>
    </div>
    <div class="summary-card s-loading">
      <span class="label">⟳ Loading</span>
      <span class="value" id="summary-loading">0</span>
    </div>
  </div>

  <!-- Toolbar: facility tabs + search -->
  <div class="toolbar">
    <div id="tabs" class="tabs"></div>
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search-input" type="search" placeholder="Search tank or product…" oninput="renderTankGrid()">
    </div>
  </div>

  <!-- Sort row -->
  <div class="sort-row">
    Sort by:
    <button class="sort-btn active" id="sort-status"  onclick="setSort('status')">Status</button>
    <button class="sort-btn"        id="sort-fill-asc" onclick="setSort('fill-asc')">Fill % ↑</button>
    <button class="sort-btn"        id="sort-fill-desc"onclick="setSort('fill-desc')">Fill % ↓</button>
    <button class="sort-btn"        id="sort-name"     onclick="setSort('name')">Name</button>
    <span style="margin-left:auto;display:flex;gap:.4rem;">
      <button class="sort-btn active" id="view-list"  onclick="setView('list')">☰ List</button>
      <button class="sort-btn"        id="view-cards" onclick="setView('cards')">⊞ Cards</button>
    </span>
  </div>

  <!-- Tank grid (or setup/error panel) -->
  <div id="tanks-container"></div>
</main>


<!-- ─── Application logic ────────────────────────────────── -->
<script>
/* ── State ─────────────────────────────────────────────────── */
let allFacilityData = [];
let activeFacility  = 0;
let currentSort     = 'status';
let currentView     = 'list';
let refreshTimer    = null;
let nextRefreshAt   = null;

/* ── Chart state ───────────────────────────────────────────── */
let chartInstance   = null;
let chartPeriod     = '30d';
let historyCache    = {};   // keyed by historyUrl

/* ── Chart helpers ─────────────────────────────────────────── */
async function fetchHistory(url) {
  if (historyCache[url]) return historyCache[url];
  const resp = await fetch(url, { cache: 'no-cache' });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();
  const { data } = Papa.parse(text, { header: false, skipEmptyLines: false });
  // Rows with a valid DD/MM/YYYY or D/M/YYYY date in column index 1
  const dateRe = /^\d{1,2}\/\d{1,2}\/\d{4}$/;
  const rows = data.filter(r => r[1] && dateRe.test(r[1].trim()));
  historyCache[url] = rows;
  return rows;
}

function parseDate(str) {
  const [d, m, y] = str.trim().split('/').map(Number);
  return new Date(y, m - 1, d);
}

function getDailyPoints(rows) {
  // rows: each is an array; col[1]=date, col[8]=Stock Total (in MT)
  // Take the last stock value per calendar day; convert MT→kg
  const byDay = {};
  const now = new Date();
  const minYear = 2000;
  const maxYear = now.getFullYear() + 1; // allow up to 1 year in future
  rows.forEach(r => {
    const dateStr = r[1].trim();
    const val = parseFloat(r[8]);
    if (isNaN(val)) return;
    const parsed = parseDate(dateStr);
    const yr = parsed.getFullYear();
    if (yr < minYear || yr > maxYear) return; // reject typo years like 5024
    byDay[dateStr] = val;
  });
  return Object.entries(byDay)
    .map(([ds, mt]) => ({ date: parseDate(ds), stock: mt * 1000 })) // MT → kg
    .sort((a, b) => a.date - b.date);
}

function filterByPeriod(points, period) {
  if (period === 'all') return points;
  const now   = new Date();
  const cutoff = new Date(now);
  if      (period === '7d')  cutoff.setDate(now.getDate() - 7);
  else if (period === '30d') cutoff.setDate(now.getDate() - 30);
  else if (period === '90d') cutoff.setDate(now.getDate() - 90);
  else if (period === '6m')  cutoff.setMonth(now.getMonth() - 6);
  else if (period === '1y')  cutoff.setFullYear(now.getFullYear() - 1);
  return points.filter(p => p.date >= cutoff);
}

function chartColors() {
  const dark = document.documentElement.classList.contains('dark');
  return {
    text:    dark ? '#e2e8f0' : '#1a202c',
    muted:   dark ? '#8892a4' : '#64748b',
    border:  dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.07)',
    stock:   '#16a34a',
    stockBg: dark ? 'rgba(22,163,74,.15)' : 'rgba(22,163,74,.10)',
    cap:     dark ? 'rgba(255,255,255,.25)' : 'rgba(100,116,139,.4)',
  };
}

function buildChartJS(points, capacity) {
  const canvas = document.getElementById('history-canvas');
  if (!canvas) return;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const c = chartColors();
  const capMT = capacity / 1000; // for tooltip display

  chartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'Stock (kg)',
          data: points.map(p => ({ x: p.date, y: p.stock })),
          borderColor: c.stock,
          backgroundColor: c.stockBg,
          fill: true,
          tension: 0.3,
          pointRadius: points.length > 120 ? 0 : 2,
          pointHoverRadius: 5,
          borderWidth: 2,
        },
        {
          label: 'Capacity',
          data: points.length
            ? [{ x: points[0].date, y: capacity }, { x: points[points.length-1].date, y: capacity }]
            : [],
          borderColor: c.cap,
          borderDash: [6, 4],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: {
            tooltipFormat: 'dd/MM/yyyy',
            minUnit: 'day',
            displayFormats: { day:'dd MMM', week:'dd MMM', month:'MMM yy', year:'yyyy' }
          },
          ticks: { color: c.muted, maxTicksLimit: 8 },
          grid:  { color: c.border },
        },
        y: {
          min: 0,
          suggestedMax: capacity * 1.08,
          ticks: {
            color: c.muted,
            callback: v => (v / 1000).toFixed(0) + ' MT'
          },
          grid: { color: c.border },
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.dataset.label === 'Capacity')
                return `Capacity: ${(ctx.raw.y/1000).toFixed(0)} MT`;
              const kg  = ctx.raw.y;
              const mt  = (kg / 1000).toFixed(1);
              const pct = capacity > 0 ? (kg / capacity * 100).toFixed(1) : '—';
              return `Stock: ${mt} MT  (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

function updateChartColors() {
  if (!chartInstance) return;
  const c = chartColors();
  chartInstance.options.scales.x.ticks.color = c.muted;
  chartInstance.options.scales.x.grid.color  = c.border;
  chartInstance.options.scales.y.ticks.color = c.muted;
  chartInstance.options.scales.y.grid.color  = c.border;
  chartInstance.data.datasets[0].borderColor     = c.stock;
  chartInstance.data.datasets[0].backgroundColor = c.stockBg;
  chartInstance.data.datasets[1].borderColor     = c.cap;
  chartInstance.update();
}

async function renderChart(fac) {
  const wrap = document.getElementById('chart-canvas-wrap');
  if (!wrap) return;
  wrap.innerHTML = '<div class="chart-loading">Loading history…</div>';
  try {
    const rows   = await fetchHistory(fac.historyUrl);
    const all    = getDailyPoints(rows);
    const points = filterByPeriod(all, chartPeriod);
    if (!points.length) {
      wrap.innerHTML = '<div class="chart-loading">No data for selected period.</div>';
      return;
    }
    wrap.innerHTML = '<canvas id="history-canvas"></canvas>';
    buildChartJS(points, fac.capacity);
    // Update data-point count label
    const lbl = document.getElementById('chart-pts-label');
    if (lbl) lbl.textContent = `${points.length} data points`;
  } catch(e) {
    wrap.innerHTML = `<div class="chart-loading" style="color:var(--red)">Could not load history: ${esc(e.message)}</div>`;
  }
}

function renderChartSection(fac) {
  if (!fac.historyUrl || fac.historyUrl.includes('PASTE_YOUR')) {
    const msg = document.createElement('div');
    msg.className = 'chart-section';
    msg.innerHTML = `<div class="chart-header"><span class="chart-title">Tank 32 — Stock History</span></div>
      <div class="chart-loading">
        To enable the history chart, publish the <strong>Tank 32</strong> sheet tab to web as CSV
        and paste the URL into <code>historyUrl</code> in CONFIG.
      </div>`;
    document.getElementById('tanks-container').appendChild(msg);
    return;
  }

  const PERIODS = [
    { key:'7d',  label:'7D'  },
    { key:'30d', label:'30D' },
    { key:'90d', label:'90D' },
    { key:'6m',  label:'6M'  },
    { key:'1y',  label:'1Y'  },
    { key:'all', label:'All' },
  ];

  const section = document.createElement('div');
  section.className = 'chart-section';
  section.id = 'chart-section';
  section.innerHTML = `
    <div class="chart-header">
      <div class="chart-title">
        Tank 32 — Stock History
        <span id="chart-pts-label"></span>
      </div>
      <div class="period-btns">
        ${PERIODS.map(p =>
          `<button class="period-btn${p.key === chartPeriod ? ' active' : ''}"
            onclick="setPeriod('${p.key}')">${p.label}</button>`
        ).join('')}
      </div>
    </div>
    <div class="chart-canvas-wrap" id="chart-canvas-wrap">
      <div class="chart-loading">Loading history…</div>
    </div>
    <div class="chart-legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#16a34a"></div>
        Stock total
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:rgba(100,116,139,.5);border-top:2px dashed rgba(100,116,139,.5)"></div>
        Capacity (1,380 MT)
      </div>
    </div>`;
  document.getElementById('tanks-container').appendChild(section);
  renderChart(fac);
}

function setPeriod(p) {
  chartPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase() === p || b.onclick.toString().includes(`'${p}'`));
  });
  const fac = allFacilityData[activeFacility];
  if (fac) renderChart(fac);
}

function destroyChart() {
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
}

function toggleDark() {
  const on = document.documentElement.classList.toggle('dark');
  document.getElementById('dark-toggle').textContent = on ? '☀️' : '🌙';
  localStorage.setItem('darkMode', on ? '1' : '0');
  updateChartColors();
}

function setView(v) {
  currentView = v;
  document.getElementById('view-list') ?.classList.toggle('active', v === 'list');
  document.getElementById('view-cards')?.classList.toggle('active', v === 'cards');
  renderTankGrid();
}

/* ── Helpers ───────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function colVal(row, key, cols) {
  const colMap = cols || CONFIG.columns;
  const header = colMap[key] || key;
  const k = Object.keys(row).find(k => k.trim().toLowerCase() === header.toLowerCase());
  return k ? (row[k] ?? '').toString().trim() : '';
}

/* ── Shared-facility helpers ───────────────────────────────── */
function groupByTank(rows, facCols) {
  const groups = {};
  rows.forEach(row => {
    const id = colVal(row, 'name', facCols);
    if (!groups[id]) groups[id] = [];
    groups[id].push(row);
  });
  return groups;
}

function sharedTankStatus(rows, fac) {
  const facCols = fac.columns || CONFIG.columns;
  const capacity = fac.capacity || 0;
  const totalStock = rows.reduce((sum, row) => {
    const v = parseFloat(colVal(row, 'volume', facCols).replace(/,/g,''));
    return sum + (isNaN(v) ? 0 : v);
  }, 0);
  const pct = capacity > 0 ? Math.min(100, totalStock / capacity * 100) : null;
  if (pct === null)                          return 'unknown';
  if (pct <= 0)                              return 'warning';  // empty tank
  if (pct >= CONFIG.thresholds.optimal)      return 'optimal';
  return 'loading';
}

function getFacilityTankStatuses(fac) {
  if (fac.error || fac.demo || !fac.tanks.length) return [];
  if (fac.type === 'shared') {
    const facCols = fac.columns || CONFIG.columns;
    return Object.values(groupByTank(fac.tanks, facCols))
                 .map(rows => sharedTankStatus(rows, fac));
  }
  return fac.tanks.map(row => statusOf(row));
}

function fillPct(row) {
  // Use pre-calculated percentage column if available
  const direct = colVal(row,'pct').replace(/%/g,'').replace(/,/g,'').trim();
  if (direct !== '') {
    const n = parseFloat(direct);
    if (!isNaN(n)) return Math.min(100, Math.max(0, n));
  }
  // Fall back to computing from volume / capacity
  const vol = parseFloat(colVal(row,'volume').replace(/,/g,''));
  const cap = parseFloat(colVal(row,'capacity').replace(/,/g,''));
  if (isNaN(vol) || isNaN(cap) || cap === 0) return null;
  return Math.min(100, Math.max(0, vol / cap * 100));
}

function statusOf(row) {
  const manual = colVal(row,'status').toLowerCase();
  if (['optimal'].includes(manual))                return 'optimal';
  if (['warning','warn','empty'].includes(manual)) return 'warning';
  const pct = fillPct(row);
  if (pct === null)                                return 'unknown';
  if (pct <= 0)                                    return 'warning';  // empty tank
  if (pct >= CONFIG.thresholds.optimal)            return 'optimal';
  return 'loading';
}

function statusWeight(s) { return {warning:0, loading:1, unknown:2, optimal:3}[s] ?? 3; }

function fmtNum(raw) {
  const n = parseFloat((raw||'').replace(/,/g,''));
  return isNaN(n) ? raw : n.toLocaleString();
}

function isPlaceholder(url) {
  return !url || url.includes('PASTE_YOUR');
}

/* ── Data loading ──────────────────────────────────────────── */
async function fetchCSV(url) {
  const resp = await fetch(url, { cache: 'no-cache' });
  if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${resp.statusText}`);
  const text = await resp.text();
  const { data } = Papa.parse(text, { header: true, skipEmptyLines: true });
  return data;
}

async function loadAll() {
  allFacilityData = [];
  for (const fac of CONFIG.facilities) {
    if (isPlaceholder(fac.csvUrl)) {
      allFacilityData.push({ ...fac, tanks: [], error: null, demo: true });
    } else {
      try {
        const tanks = await fetchCSV(fac.csvUrl);
        allFacilityData.push({ ...fac, tanks, error: null });
      } catch(e) {
        allFacilityData.push({ ...fac, tanks: [], error: e.message });
      }
    }
  }
}

/* ── Rendering ─────────────────────────────────────────────── */
function renderHeader() {
  document.getElementById('header-title').textContent = CONFIG.title;
  document.title = CONFIG.title;
}

function renderSummary() {
  const statuses = allFacilityData.flatMap(f => getFacilityTankStatuses(f));
  document.getElementById('summary-total').textContent    = statuses.length || '—';
  document.getElementById('summary-optimal').textContent  = statuses.filter(s => s==='optimal').length;
  document.getElementById('summary-warning').textContent  = statuses.filter(s => s==='warning').length;
  document.getElementById('summary-loading').textContent  = statuses.filter(s => s==='loading').length;
}

function renderTabs() {
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  allFacilityData.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === activeFacility ? ' active' : '');
    const warnCount = getFacilityTankStatuses(f).filter(s => s==='warning').length;
    btn.textContent  = f.name + (warnCount ? ` (${warnCount} ⚠)` : '');
    btn.onclick = () => { activeFacility = i; renderTabs(); renderTankGrid(); };
    wrap.appendChild(btn);
  });
}

function renderTankGrid() {
  const wrap   = document.getElementById('tanks-container');
  const query  = (document.getElementById('search-input').value || '').toLowerCase();
  const fac    = allFacilityData[activeFacility];
  destroyChart();
  wrap.innerHTML = '';

  if (!fac) return;

  if (fac.demo) {
    wrap.innerHTML = `
      <div class="setup-panel">
        <h2>Setup Required</h2>
        <p>Edit the <code>CONFIG</code> section at the top of this file to connect your Google Sheets data.</p>
        <ol>
          <li>Open your Google Sheet.</li>
          <li>Go to <strong>File → Share → Publish to web</strong>.</li>
          <li>Pick the correct sheet tab and select <strong>CSV</strong> as the format.</li>
          <li>Click <strong>Publish</strong>, then copy the URL.</li>
          <li>Paste it into <code>CONFIG.facilities[].csvUrl</code> and save this file.</li>
          <li>Update <code>CONFIG.columns</code> so the names match your sheet's column headers.</li>
        </ol>
      </div>`;
    return;
  }

  if (fac.error) {
    wrap.innerHTML = `<div class="error-msg">
      <strong>Could not load data for "${esc(fac.name)}".</strong><br>
      ${esc(fac.error)}<br><br>
      Make sure the Google Sheet is published to web as CSV
      (<em>File → Share → Publish to web</em>).
    </div>`;
    return;
  }

  if (fac.tanks.length === 0) {
    wrap.innerHTML = `<div class="loading-msg">No rows found. Check the CSV URL and column headers in CONFIG.</div>`;
    return;
  }

  // ── Shared facility: group rows by tank, render as list or cards ──
  if (fac.type === 'shared') {
    const facCols = fac.columns || CONFIG.columns;
    const groups  = groupByTank(fac.tanks, facCols);
    // Filter groups by search query
    const filteredGroups = {};
    Object.entries(groups).forEach(([tankId, rows]) => {
      if (query) {
        const product  = colVal(rows[0], 'product', facCols).toLowerCase();
        const shippers = rows.map(r => colVal(r, 'shipper', facCols).toLowerCase()).join(' ');
        if (!tankId.toLowerCase().includes(query) && !product.includes(query) && !shippers.includes(query)) return;
      }
      filteredGroups[tankId] = rows;
    });
    if (!Object.keys(filteredGroups).length) {
      wrap.innerHTML = `<div class="no-results">No tanks match your search.</div>`;
      return;
    }
    if (currentView === 'list') {
      const tableWrap = document.createElement('div');
      tableWrap.className = 'table-wrap';
      tableWrap.appendChild(buildSharedList(filteredGroups, fac));
      wrap.appendChild(tableWrap);
    } else {
      const grid = document.createElement('div');
      grid.className = 'tank-grid';
      Object.entries(filteredGroups).forEach(([tankId, rows]) => grid.appendChild(buildSharedCard(tankId, rows, fac)));
      wrap.appendChild(grid);
    }
    renderChartSection(fac);
    return;
  }

  // Filter
  let tanks = fac.tanks.filter(row => {
    if (!query) return true;
    const name    = colVal(row,'name').toLowerCase();
    const product = colVal(row,'product').toLowerCase();
    return name.includes(query) || product.includes(query);
  });

  // Sort
  tanks = [...tanks].sort((a,b) => {
    if (currentSort === 'status')     return statusWeight(statusOf(a)) - statusWeight(statusOf(b));
    if (currentSort === 'fill-asc')   return (fillPct(a)??999) - (fillPct(b)??999);
    if (currentSort === 'fill-desc')  return (fillPct(b)??-1)  - (fillPct(a)??-1);
    if (currentSort === 'name')       return colVal(a,'name').localeCompare(colVal(b,'name'));
    return 0;
  });

  if (tanks.length === 0) {
    wrap.innerHTML = `<div class="no-results">No tanks match your search.</div>`;
    return;
  }

  if (currentView === 'list') {
    const tableWrap = document.createElement('div');
    tableWrap.className = 'table-wrap';
    tableWrap.appendChild(buildList(tanks));
    wrap.appendChild(tableWrap);
  } else {
    const grid = document.createElement('div');
    grid.className = 'tank-grid';
    tanks.forEach(row => grid.appendChild(buildCard(row)));
    wrap.appendChild(grid);
  }
}

function buildCard(row) {
  const status  = statusOf(row);
  const pct     = fillPct(row);
  const name    = colVal(row,'name')    || 'Unnamed Tank';
  const product = colVal(row,'product') || '';
  const vol     = fmtNum(colVal(row,'volume'));
  const cap     = fmtNum(colVal(row,'capacity'));
  const unit    = colVal(row,'unit') || CONFIG.defaultUnit || '';
  const unitStr = unit ? ` ${unit}` : '';

  const card = document.createElement('div');
  card.className = `tank-card${(status === 'optimal' || status === 'warning') ? ' '+status : ''}`;

  const pctDisp   = pct !== null ? pct.toFixed(1) + '%' : '—';
  const barWidth  = pct !== null ? pct.toFixed(1) : 0;
  const chip      = (status === 'optimal' || status === 'warning')
                    ? `<span class="status-chip">${status}</span>` : '';
  const volLine   = (vol && cap)
                    ? `${vol}${unitStr} / ${cap}${unitStr}`
                    : vol ? `${vol}${unitStr}` : '';

  card.innerHTML = `
    ${chip}
    <div class="tank-name">${esc(name)}</div>
    ${product ? `<span class="product-badge">${esc(product)}</span>` : ''}
    <div class="fill-bar-bg">
      <div class="fill-bar" style="width:${barWidth}%"></div>
    </div>
    <div class="fill-pct">${pctDisp}</div>
    ${volLine ? `<div class="fill-vols">${esc(volLine)}</div>` : ''}
  `;
  return card;
}

function buildList(tanks) {
  const table = document.createElement('table');
  table.className = 'tank-table';
  table.innerHTML = `<thead><tr>
    <th>Tank</th>
    <th>Product / Supplier</th>
    <th class="col-num">Stock (kg)</th>
    <th class="col-num">Capacity (kg)</th>
    <th class="col-pct">% Used</th>
  </tr></thead><tbody></tbody>`;
  const tbody = table.querySelector('tbody');

  tanks.forEach(row => {
    const status   = statusOf(row);
    const pct      = fillPct(row);
    const name     = colVal(row,'name')    || '—';
    const product  = colVal(row,'product') || '—';
    const vol      = fmtNum(colVal(row,'volume'));
    const cap      = fmtNum(colVal(row,'capacity'));
    const pctDisp  = pct !== null ? pct.toFixed(2) + '%' : '—';
    const barWidth = pct !== null ? pct.toFixed(1) : 0;
    const chip     = (status === 'optimal' || status === 'warning')
                     ? `<span class="row-status-chip ${status}">${status}</span>` : '';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="col-tank">${esc(name)}${chip}</td>
      <td class="col-product">${esc(product)}</td>
      <td class="col-num">${esc(vol)}</td>
      <td class="col-num">${esc(cap)}</td>
      <td class="col-pct">
        <div class="pct-cell">
          <div class="pct-track"><div class="pct-fill ${status}" style="width:${barWidth}%"></div></div>
          <span class="pct-label ${status}">${pctDisp}</span>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
  return table;
}

function buildSharedList(groups, fac) {
  const facCols  = fac.columns || CONFIG.columns;
  const unit     = fac.defaultUnit || CONFIG.defaultUnit || '';
  const unitStr  = unit ? ` ${unit}` : '';
  const capacity = fac.capacity || 0;

  const table = document.createElement('table');
  table.className = 'tank-table';
  table.innerHTML = `<thead><tr>
    <th>Tank</th>
    <th class="col-shared-meta">Product</th>
    <th class="col-shared-meta">Vessel</th>
    <th>Shipper</th>
    <th class="col-num">Stock (kg)</th>
    <th class="col-num">Nominated (kg)</th>
    <th class="col-pct">% Used</th>
  </tr></thead><tbody></tbody>`;
  const tbody = table.querySelector('tbody');

  Object.entries(groups).forEach(([tankId, rows]) => {
    const totalStock = rows.reduce((sum, row) => {
      const v = parseFloat(colVal(row, 'volume', facCols).replace(/,/g,''));
      return sum + (isNaN(v) ? 0 : v);
    }, 0);
    const pct     = capacity > 0 ? Math.min(100, totalStock / capacity * 100) : null;
    const status  = sharedTankStatus(rows, fac);
    const product = colVal(rows[0], 'product', facCols);
    const vessels = [...new Set(rows.map(r => colVal(r, 'vessel', facCols)).filter(Boolean))].join(', ');
    const pctDisp  = pct !== null ? pct.toFixed(1) + '%' : '—';
    const barWidth = pct !== null ? pct.toFixed(1) : 0;
    const chip = (status === 'optimal' || status === 'warning')
                 ? `<span class="row-status-chip ${status}">${status}</span>` : '';

    // ── Tank summary row ──
    const summaryTr = document.createElement('tr');
    summaryTr.className = 'shared-summary-row';
    summaryTr.innerHTML = `
      <td class="col-tank">Tank ${esc(tankId)}${chip}</td>
      <td class="col-product col-shared-meta">${esc(product)}</td>
      <td class="col-product col-shared-meta">${esc(vessels)}</td>
      <td class="col-product" style="color:var(--muted)">— total —</td>
      <td class="col-num">${totalStock.toLocaleString()}${esc(unitStr)}</td>
      <td class="col-num">${capacity.toLocaleString()}${esc(unitStr)}</td>
      <td class="col-pct">
        <div class="pct-cell">
          <div class="pct-track"><div class="pct-fill ${status}" style="width:${barWidth}%"></div></div>
          <span class="pct-label ${status}">${pctDisp}</span>
        </div>
      </td>`;
    tbody.appendChild(summaryTr);

    // ── One row per shipper ──
    rows.forEach(row => {
      const shipper      = colVal(row, 'shipper',   facCols);
      const stockNum     = parseFloat(colVal(row, 'volume',    facCols).replace(/,/g,'')) || 0;
      const nominatedNum = parseFloat(colVal(row, 'nominated', facCols).replace(/,/g,'')) || 0;
      const diff         = stockNum - nominatedNum;
      let rowClass = '';
      if      (diff < -100000)         rowClass = 'ship-row-under';
      else if (Math.abs(diff) <= 5000) rowClass = 'ship-row-ok';
      else if (diff > 10000)           rowClass = 'ship-row-over';

      const sPct      = nominatedNum > 0 ? Math.min(200, stockNum / nominatedNum * 100) : null;
      const sPctDisp  = sPct !== null ? sPct.toFixed(1) + '%' : '—';
      const sBarWidth = sPct !== null ? Math.min(100, sPct).toFixed(1) : 0;
      const sStatus   = sPct !== null && sPct >= 95 ? 'optimal' : 'loading';

      const tr = document.createElement('tr');
      tr.className = rowClass;
      tr.innerHTML = `
        <td></td>
        <td class="col-shared-meta"></td>
        <td class="col-shared-meta"></td>
        <td class="col-tank shipper-indent">↳ ${esc(shipper)}</td>
        <td class="col-num">${fmtNum(colVal(row, 'volume',    facCols))}${esc(unitStr)}</td>
        <td class="col-num">${fmtNum(colVal(row, 'nominated', facCols))}${esc(unitStr)}</td>
        <td class="col-pct">
          <div class="pct-cell">
            <div class="pct-track"><div class="pct-fill ${sStatus}" style="width:${sBarWidth}%"></div></div>
            <span class="pct-label ${sStatus}">${sPctDisp}</span>
          </div>
        </td>`;
      tbody.appendChild(tr);
    });
  });
  return table;
}

function buildSharedCard(tankId, rows, fac) {
  const facCols  = fac.columns || CONFIG.columns;
  const unit     = fac.defaultUnit || CONFIG.defaultUnit || '';
  const unitStr  = unit ? ` ${unit}` : '';
  const capacity = fac.capacity || 0;

  // Sum total stock across all shippers
  const totalStock = rows.reduce((sum, row) => {
    const v = parseFloat(colVal(row, 'volume', facCols).replace(/,/g,''));
    return sum + (isNaN(v) ? 0 : v);
  }, 0);

  const pct      = capacity > 0 ? Math.min(100, totalStock / capacity * 100) : null;
  const status   = sharedTankStatus(rows, fac);
  const product  = colVal(rows[0], 'product', facCols);
  const vessels  = [...new Set(rows.map(r => colVal(r, 'vessel', facCols)).filter(Boolean))].join(', ');

  const pctDisp  = pct !== null ? pct.toFixed(1) + '%' : '—';
  const barWidth = pct !== null ? pct.toFixed(1) : 0;
  const chip     = (status === 'optimal' || status === 'warning')
                   ? `<span class="status-chip">${status}</span>` : '';

  const shipperRows = rows.map(row => {
    const shipper      = colVal(row, 'shipper',   facCols);
    const stock        = fmtNum(colVal(row, 'volume',    facCols));
    const nominated    = fmtNum(colVal(row, 'nominated', facCols));
    const stockNum     = parseFloat(colVal(row, 'volume',    facCols).replace(/,/g,'')) || 0;
    const nominatedNum = parseFloat(colVal(row, 'nominated', facCols).replace(/,/g,'')) || 0;
    const diff         = stockNum - nominatedNum;
    let rowClass = '';
    if      (diff < -100000)          rowClass = 'ship-row-under'; // yellow: under by >100k
    else if (Math.abs(diff) <= 5000)  rowClass = 'ship-row-ok';   // green:  within ±5k
    else if (diff > 10000)            rowClass = 'ship-row-over';  // red:    over by >10k
    // otherwise: default white
    return `<tr class="${rowClass}">
      <td>${esc(shipper)}</td>
      <td>${esc(stock)}${esc(unitStr)}</td>
      <td>${esc(nominated)}${esc(unitStr)}</td>
    </tr>`;
  }).join('');

  const card = document.createElement('div');
  card.className = `tank-card shared-card${(status === 'optimal' || status === 'warning') ? ' '+status : ''}`;
  card.innerHTML = `
    ${chip}
    <div class="shared-header">
      <div>
        <div class="tank-name">Tank ${esc(tankId)}</div>
        ${product ? `<span class="product-badge">${esc(product)}</span>` : ''}
      </div>
      ${vessels ? `<div class="vessel-badge">⛴ ${esc(vessels)}</div>` : ''}
    </div>
    <div class="fill-bar-bg">
      <div class="fill-bar" style="width:${barWidth}%"></div>
    </div>
    <div class="shared-fill-row">
      <span class="fill-pct">${pctDisp}</span>
      <span class="fill-vols">${totalStock.toLocaleString()}${esc(unitStr)} / ${capacity.toLocaleString()}${esc(unitStr)}</span>
    </div>
    <table class="shipper-table">
      <thead><tr><th>Shipper</th><th>Stock</th><th>Nominated</th></tr></thead>
      <tbody>${shipperRows}</tbody>
    </table>`;
  return card;
}

/* ── Sort controls ─────────────────────────────────────────── */
function setSort(key) {
  currentSort = key;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-'+key)?.classList.add('active');
  renderTankGrid();
}

/* ── Refresh & timing ──────────────────────────────────────── */
function updateTimestamps() {
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function tickCountdown() {
  const el = document.getElementById('next-refresh');
  if (!el || !nextRefreshAt) return;
  const secs = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
  const m = Math.floor(secs/60), s = secs%60;
  el.textContent = `Next refresh in ${m}:${s.toString().padStart(2,'0')}`;
}

async function doRefresh() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '⟳ Loading…';

  await loadAll();
  renderSummary();
  renderTabs();
  renderTankGrid();
  updateTimestamps();

  nextRefreshAt = Date.now() + CONFIG.refreshMinutes * 60 * 1000;
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(doRefresh, CONFIG.refreshMinutes * 60 * 1000);

  btn.disabled = false;
  btn.textContent = '⟳ Refresh';
}

function manualRefresh() {
  clearTimeout(refreshTimer);
  doRefresh();
}

/* ── Init ──────────────────────────────────────────────────── */
async function init() {
  if (localStorage.getItem('darkMode') === '1') {
    document.documentElement.classList.add('dark');
    document.getElementById('dark-toggle').textContent = '☀️';
  }
  renderHeader();
  document.getElementById('tanks-container').innerHTML =
    '<div class="loading-msg">Loading data…</div>';
  await doRefresh();
  setInterval(tickCountdown, 1000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
