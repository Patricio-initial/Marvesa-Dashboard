<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dashboard Tanques</title>

<style>
:root{
  --bg:#0b1020;
  --card:#111a33;
  --text:#e9f0ff;
  --muted:#9fb0d0;
  --line:rgba(255,255,255,.08);
  --radius:14px;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:1200px;margin:auto;padding:20px;}
h1{margin:0 0 10px 0;font-size:20px;}
.section-title{
  margin:30px 0 12px;
  font-size:15px;
  letter-spacing:.4px;
  color:var(--muted);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:14px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
}
.small-card{
  padding:10px 12px;
  font-size:13px;
}
.bar{
  height:10px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  margin-top:8px;
  overflow:hidden;
}
.bar div{
  height:100%;
  width:0%;
  transition:.3s ease;
}
.kpi{
  font-size:14px;
  font-weight:600;
}
.meta{
  font-size:12px;
  color:var(--muted);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
thead{
  background:rgba(255,255,255,.04);
}
th,td{
  padding:10px;
  border-bottom:1px solid var(--line);
}
th{text-align:left;color:var(--muted);}
.status-ok{background:#22c55e;}
.status-mid{background:#f59e0b;}
.status-high{background:#ef4444;}
</style>
</head>

<body>
<div class="wrap">

<h1>Dashboard Tanques — Stock</h1>

<div class="section-title">Resumen por Proveedor</div>
<div id="supplierGrid" class="grid"></div>

<div class="section-title">Detalle Tanque por Tanque</div>
<div id="tankGrid" class="grid"></div>

<div class="section-title">Tabla Resumen</div>
<table>
<thead>
<tr>
<th>Tanque</th>
<th>Proveedor</th>
<th>Stock (kg)</th>
<th>Capacidad (kg)</th>
<th>%</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdyOrnlQBDihM-vR3ylD5hyWkwahrugTXpi_tEeEwRxXZiNIEGlZ2VMZvwJ3gkzxHF2XNcFXMQApun/pub?gid=1509369466&single=true&output=csv";

function parseCSV(text){
  return text.trim().split("\n").map(r=>r.split(","));
}

function parseNum(v){
  return parseFloat(v.replace(/,/g,""))||0;
}

function pctColor(p){
  if(p>=85) return "status-high";
  if(p>=65) return "status-mid";
  return "status-ok";
}

async function load(){
  const res = await fetch(CSV_URL+"&_="+Date.now());
  const txt = await res.text();
  const rows = parseCSV(txt);

  const headers = rows[0];
  const data = rows.slice(1).map(r=>({
    tank:r[0],
    supplier:r[1],
    stock:parseNum(r[2]),
    capacity:parseNum(r[3]),
    pct:parseFloat(r[4])
  }));

  renderSuppliers(data);
  renderTanks(data);
  renderTable(data);
}

function renderSuppliers(data){
  const grid=document.getElementById("supplierGrid");
  grid.innerHTML="";

  const grouped={};
  data.forEach(d=>{
    if(!grouped[d.supplier]) grouped[d.supplier]={stock:0,cap:0};
    grouped[d.supplier].stock+=d.stock;
    grouped[d.supplier].cap+=d.capacity;
  });

  Object.entries(grouped).forEach(([sup,val])=>{
    const pct=(val.stock/val.cap)*100;
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="kpi">${sup}</div>
      <div class="meta">${val.stock.toLocaleString()} kg / ${val.cap.toLocaleString()} kg</div>
      <div class="bar"><div class="${pctColor(pct)}" style="width:${pct}%"></div></div>
      <div class="meta">${pct.toFixed(1)}% ocupación</div>
    `;
    grid.appendChild(card);
  });
}

function renderTanks(data){
  const grid=document.getElementById("tankGrid");
  grid.innerHTML="";

  data.forEach(d=>{
    const card=document.createElement("div");
    card.className="card small-card";
    card.innerHTML=`
      <strong>TK ${d.tank}</strong><br>
      <span class="meta">${d.supplier}</span><br>
      ${d.stock.toLocaleString()} kg (${d.pct}%)
      <div class="bar"><div class="${pctColor(d.pct)}" style="width:${d.pct}%"></div></div>
    `;
    grid.appendChild(card);
  });
}

function renderTable(data){
  const body=document.getElementById("tableBody");
  body.innerHTML="";
  data.forEach(d=>{
    body.innerHTML+=`
      <tr>
        <td>${d.tank}</td>
        <td>${d.supplier}</td>
        <td>${d.stock.toLocaleString()}</td>
        <td>${d.capacity.toLocaleString()}</td>
        <td>${d.pct}%</td>
      </tr>
    `;
  });
}

load();
setInterval(load,300000);
</script>

</body>
</html>
